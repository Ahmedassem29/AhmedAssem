<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcf3d">
<title>زيّي · Zayyi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a sticker-book school planner — outlined, offset-shadow stickers on a dotted notebook page; illustrated hero, ticket for the next day, then a month-by-month sticker timeline. Single bright theme by choice. */
:root{
  --page:#f7f9ff; --dot:#dfe5f3; --card:#ffffff; --ink:#1d2547; --muted:#59618a; --line:#1d2547;
  --sun:#ffcf3d; --sky:#43b0f1; --grass:#1fae6b; --coral:#ff6b57; --berry:#ef5a8d; --grape:#7a5cf0;
  --sky-soft:#dff1fd; --grass-soft:#d9f4e6; --sun-soft:#fff2c2; --coral-soft:#ffe1da; --berry-soft:#ffdbe8;
  --display:"Baloo Bhaijaan 2","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro","Baloo Bhaijaan 2",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:22px; --sh:4px 4px 0 var(--ink); color-scheme:light;
}
*{box-sizing:border-box}
body{background-color:var(--page);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
svg .k{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-inline:16px;padding-block:10px}
.bar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:var(--sh)}
[dir="rtl"] .bar .in{padding:6px 14px 6px 8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo .mk{width:40px;height:40px;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;display:block}
.logo small{font-size:11.5px;color:var(--muted);display:block;line-height:1.2}
.lang{margin-inline-start:auto;display:flex;gap:4px;background:var(--sky-soft);border:2px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:28px 8px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--sun);border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-family:var(--display);font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
[dir="rtl"] .tag{transform:rotate(2deg)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,7vw,62px);line-height:1.08;margin:16px 0 0;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--coral);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;inset-inline:0;bottom:.04em;height:.22em;background:var(--sun);z-index:-1;border-radius:6px;transform:rotate(-1deg)}
.hero p{color:var(--muted);margin:14px 0 0;max-width:52ch;font-size:16.5px}
.art{position:relative;width:100%;max-width:560px;justify-self:center}
.art svg{width:100%;height:auto;display:block;overflow:visible}

/* kids */
.kids{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.kid{display:flex;align-items:center;gap:10px;border:2.5px solid var(--line);background:var(--card);border-radius:16px;padding:6px 14px 6px 6px;cursor:pointer;text-align:start;box-shadow:3px 3px 0 var(--ink)}
[dir="rtl"] .kid{padding:6px 6px 6px 14px}
.kid[aria-pressed="true"]{background:var(--sun-soft);transform:rotate(-1.5deg)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;border:2px solid var(--line);flex:none}
.av.b{background:var(--sky-soft)} .av.g{background:var(--berry-soft)}
.kid .t{line-height:1.25;min-width:0}
.kid .t b{display:block;font-size:14.5px;font-family:var(--display)}
.kid .t span{font-size:12px;color:var(--muted)}
.add{border:2.5px dashed var(--ink);background:transparent;border-radius:16px;padding:12px 16px;cursor:pointer;font-family:var(--display);font-weight:700}
.example{margin-top:12px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.example i{width:10px;height:10px;border-radius:50%;background:var(--coral);flex:none}

/* sticker card */
.sticker{background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.kidform{margin-top:18px;padding:20px}
.kidform h2{font-family:var(--display);font-size:24px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
label.l,.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.input,select{width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.seg{display:flex;gap:10px}
.seg label{flex:1;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff;font-family:var(--display);font-weight:700;font-size:16px}
.seg span svg{width:26px;height:26px}
.seg input:checked+span{background:var(--sun);box-shadow:3px 3px 0 var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:2.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 18px;font-family:var(--display);font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.solid{background:var(--ink);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.ghost{box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 13px;font-size:14px}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}

/* ticket */
.ticket{margin-top:26px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr);border:3px solid var(--line);border-radius:28px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:var(--tint,var(--sun-soft))}
@media (max-width:720px){.ticket{grid-template-columns:1fr}}
.ticket .a{padding:24px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:480px){.ticket .a{grid-template-columns:1fr}}
.ticket .ic{width:96px;height:96px;border:3px solid var(--line);border-radius:24px;background:#fff;display:grid;place-items:center;transform:rotate(-4deg)}
.ticket .ic svg{width:70px;height:70px}
.eyebrow{font-family:var(--display);font-size:14px;font-weight:700;color:var(--muted)}
.ticket h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:2px 0 8px}
.ticket .fit{font-size:15.5px;max-width:46ch}
.ticket .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ticket .b{background:#fff;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-inline-start:3px dashed var(--line);position:relative}
@media (max-width:720px){.ticket .b{border-inline-start:0;border-top:3px dashed var(--line)}}
.count{width:150px;height:150px;border-radius:50%;background:var(--sun);border:3px solid var(--line);display:grid;place-items:center;align-content:center;box-shadow:4px 4px 0 var(--ink)}
.count .n{font-family:var(--display);font-weight:800;font-size:58px;line-height:.9;font-variant-numeric:tabular-nums}
.count .n.w{font-size:30px}
.count small{font-family:var(--display);font-weight:700;font-size:14px}
.ticket .dd{margin-top:14px;font-size:14px;font-weight:600}
.ticket .st{margin-top:4px;font-size:12.5px;color:var(--muted)}

/* school strip */
.school{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.school h3{font-family:var(--display);font-size:26px;margin:0;line-height:1.2}
.school .m{color:var(--muted);font-size:14px}
.prog{display:flex;align-items:center;gap:12px;min-width:min(100%,300px)}
.bars{flex:1;height:14px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
.bars i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--grass) 0 8px,#3cc488 8px 16px)}
.prog span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;max-width:22ch;line-height:1.3}

/* timeline */
.month{margin-top:30px}
.month h4{display:inline-block;font-family:var(--display);font-size:18px;font-weight:800;margin:0 0 12px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 16px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.ev{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-content:start}
.ev.past{opacity:.6;filter:saturate(.6)}
.ev.is-next{background:var(--sun-soft)}
.ev .tile{width:72px;height:72px;border:2.5px solid var(--line);border-radius:18px;display:grid;place-items:center;background:var(--tint)}
.ev .tile svg{width:50px;height:50px}
.ev .dt{margin-top:8px;text-align:center;font-family:var(--display);line-height:1.05}
.ev .dt b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ev .dt span{font-size:12px;color:var(--muted);font-weight:600}
.ev h5{margin:0;font-family:var(--display);font-size:19px;font-weight:800;line-height:1.2}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:11.5px;border:2px solid var(--line);border-radius:999px;padding:0 9px;font-weight:600;background:#fff}
.badge.ok{background:var(--grass);color:#fff}
.badge.soon{background:var(--coral);color:#fff}
.when{color:var(--muted);font-size:13px;margin-top:6px}
.when a,.hist a{color:var(--grape);font-weight:600}
.hist{font-size:12.5px;color:var(--muted);margin-top:4px;background:var(--sky-soft);border-radius:10px;padding:4px 8px}
.wear{margin-top:10px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{border:2px dashed #b7bfd9;border-radius:10px;padding:1px 9px;font-size:12.5px;background:#fff}
.sw{display:flex;gap:3px;margin-top:8px}
.sw i{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);display:block}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.dform{grid-column:1/-1;margin-top:4px;display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:10px;background:var(--sky-soft);border:2px dashed var(--line);border-radius:16px;padding:12px}
.dform .full{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.dform{grid-template-columns:1fr}}
.msg{font-size:13px;color:var(--grass);font-weight:700}
.note{color:var(--muted);font-size:13.5px;margin-top:16px}

/* how */
.how{margin-top:56px}
.how h3{font-family:var(--display);font-size:30px;margin:0 0 16px;text-align:center}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{padding:20px;position:relative}
.step:nth-child(1){transform:rotate(-1.2deg)} .step:nth-child(3){transform:rotate(1.2deg)}
.step .ic{width:64px;height:64px;border:2.5px solid var(--line);border-radius:18px;display:grid;place-items:center;margin-bottom:10px}
.step .ic svg{width:44px;height:44px}
.step .n{position:absolute;top:-14px;inset-inline-end:16px;width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.step h6{font-family:var(--display);font-size:20px;margin:0 0 4px}
.step p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:48px;color:var(--muted);font-size:13px;border-top:2.5px dashed #c5cce2;padding-top:18px}
footer ul{padding-inline-start:18px;margin:6px 0}
footer a{color:var(--grape)}

/* confetti */
.cf{position:fixed;top:-20px;width:10px;height:14px;border:1.5px solid var(--ink);border-radius:3px;z-index:50;pointer-events:none}

/* motion */
@media (prefers-reduced-motion:no-preference){
  .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .bob.d2{animation-delay:-1.1s}.bob.d3{animation-delay:-2.2s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .spin{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .drift{animation:drift 9s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
  .wave{animation:wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
  @keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}
  .twinkle{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .twinkle.d2{animation-delay:-.8s}.twinkle.d3{animation-delay:-1.6s}
  @keyframes tw{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(20deg)}}
  .kick{animation:kick 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes kick{0%,60%,100%{transform:translate(0,0) rotate(0)}75%{transform:translate(10px,-14px) rotate(90deg)}88%{transform:translate(4px,0) rotate(160deg)}}
  .pop{animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}
  @keyframes pop{from{transform:translateY(14px) scale(.97)}to{transform:none}}
  .ticket .ic{animation:wob 4s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .count{animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .ev .tile,.step .ic{transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
  .ev:hover .tile,.step:hover .ic{transform:rotate(-8deg) scale(1.08)}
  .btn,.kid{transition:transform .15s,box-shadow .15s}
  .btn:hover,.kid:hover{transform:translate(-1px,-2px);box-shadow:5px 6px 0 var(--ink)}
  .cf{animation:fall var(--t,1.6s) cubic-bezier(.2,.6,.4,1) forwards}
  @keyframes fall{to{transform:translate(var(--x,0),105vh) rotate(var(--r,540deg))}}
}
</style>
</head>
<body>

<header class="bar"><div class="in">
  <a class="logo" href="#top" aria-label="Zayyi">
    <svg class="mk" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="14" fill="#ffcf3d" class="k"/><path class="k" d="M17 11l-8 5 3 7 4-2v16h16V21l4 2 3-7-8-5c-1 3-3.6 5-7 5s-6-2-7-5z" fill="#ff6b57"/><circle cx="24" cy="27" r="2.6" fill="#ffffff" class="k" style="stroke-width:2"/></svg>
    <span><b id="brand"></b><small id="brandSub"></small></span></a>
  <div class="lang" role="group" aria-label="Language"><button id="l-ar" data-lang="ar">ع</button><button id="l-en" data-lang="en">EN</button></div>
</div></header>

<div class="wrap" id="top">
  <section class="hero">
    <div>
      <span class="tag" id="tag"></span>
      <h1 id="h1"></h1><p id="hsub"></p>
      <div class="kids" id="kids"></div>
      <div id="formHost"></div>
    </div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 540 420">

        <g class="drift"><path class="k" d="M84 92a18 18 0 0 1 34-6 14 14 0 0 1 22 12H72a12 12 0 0 1 12-6z" fill="#ffffff"/></g>
        <g class="spin"><g class="k" fill="none"><path d="M440 30v-14M440 128v14M386 79h-14M494 79h14M402 41l-10-10M478 117l10 10M478 41l10-10M402 117l-10 10"/></g><circle class="k" cx="440" cy="79" r="34" fill="#ffcf3d"/></g>
        <path class="twinkle" d="M300 40l5 11 12 2-9 8 2 12-10-6-10 6 2-12-9-8 12-2z" fill="#ef5a8d" stroke="#1d2547" stroke-width="2.5" stroke-linejoin="round"/>
        <path class="twinkle d2" d="M40 220l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#43b0f1" stroke="#1d2547" stroke-width="2.5" stroke-linejoin="round"/>
        <path class="twinkle d3" d="M505 240l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#1fae6b" stroke="#1d2547" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="200" y="60" width="10" height="16" rx="3" fill="#ff6b57" class="k twinkle" style="stroke-width:2"/>
        <rect x="360" y="150" width="10" height="16" rx="3" fill="#ffcf3d" class="k twinkle d2" style="stroke-width:2"/>
        <rect x="120" y="150" width="10" height="16" rx="3" fill="#7a5cf0" class="k twinkle d3" style="stroke-width:2"/>
        <ellipse cx="270" cy="392" rx="240" ry="22" fill="#bdebd2" class="k"/>
        <!-- boy in kandura with flag -->
        <g class="bob">
          <rect x="112" y="350" width="14" height="30" rx="5" fill="#c98b5e" class="k"/><rect x="134" y="350" width="14" height="30" rx="5" fill="#c98b5e" class="k"/>
          <path d="M104 380h26M130 380h26" class="k" fill="none" style="stroke-width:6"/>
          <path class="k" d="M98 232q32-22 64 0l14 128q-46 12-92 0z" fill="#ffffff"/>
          <path class="k" d="M130 236v120" fill="none" style="stroke-width:2"/>
          <g class="wave"><rect x="196" y="140" width="66" height="40" fill="#ffffff" class="k"/><rect x="196" y="140" width="16" height="40" fill="#d52b1e"/><rect x="212" y="140" width="50" height="13.3" fill="#00843d"/><rect x="212" y="166.7" width="50" height="13.3" fill="#1d2547"/><rect x="196" y="140" width="66" height="40" fill="none" class="k"/></g>
          <path d="M196 136v130" class="k" fill="none" style="stroke:#8a6a4a;stroke-width:5"/>
          <path d="M160 262l36-28" class="k" fill="none" style="stroke-width:12;stroke:#1d2547"/><path d="M160 262l36-28" fill="none" style="stroke:#fff;stroke-width:6;stroke-linecap:round"/>
          <circle cx="196" cy="234" r="8" fill="#c98b5e" class="k"/>
          <path class="k" d="M96 196q34-58 68 0l8 52q-22-26-42-26t-42 26z" fill="#ffffff"/>
          <circle cx="130" cy="196" r="27" fill="#c98b5e" class="k"/>
          <path class="k" d="M100 190q30-46 60 0q-30-14-60 0z" fill="#ffffff"/>
          <ellipse cx="130" cy="172" rx="30" ry="7" fill="none" class="k" style="stroke-width:5"/>
          <circle cx="120" cy="198" r="3.2" fill="#1d2547"/><circle cx="140" cy="198" r="3.2" fill="#1d2547"/>
          <path d="M120 210q10 9 20 0" class="k" fill="none" style="stroke-width:2.5"/>
          <circle cx="112" cy="207" r="4" fill="#ff8f7a" opacity=".55"/><circle cx="148" cy="207" r="4" fill="#ff8f7a" opacity=".55"/>
        </g>
        <!-- girl in pink with book -->
        <g class="bob d2">
          <circle cx="306" cy="160" r="15" fill="#3a2a22" class="k"/>
          <circle cx="270" cy="182" r="35" fill="#3a2a22" class="k"/>

      const dt=parse(e.date),dd=daysTo(e.date);idx++;
      const st=e.confirmed?`<span class="badge ok">${t().confirmed}</span>`:`<span class="badge">${e.fixed?t().official:t().expected}</span>`;
      const soon=dd>=0&&dd<=14?`<span class="badge soon">${t().inDays(num(dd))}</span>`:"";
      const hist=e.hist?`<div class="hist">${t().lastYear}: ${fmt(parse(e.hist.date),{day:"numeric",month:"long",year:"numeric"})}${e.hist.note&&lang==="ar"?" — "+esc(e.hist.note):""}${e.hist.source&&/^https:\/\//.test(e.hist.source)?` · <a href="${esc(e.hist.source)}" target="_blank" rel="noopener">${t().source}</a>`:""}</div>`:"";
      const when=e.confirmed?((e.rnote&&lang==="ar")?esc(e.rnote):t().fromCirc):esc(e.exp[L()]);
      h+=`<article class="ev pop${dd<0?" past":""}${nx&&e.id===nx.id?" is-next":""}" style="--tint:${TINT[e.id]||"#fff2c2"};animation-delay:${Math.min(idx,10)*45}ms">
        <div><div class="tile">${icon(e.id)}</div><div class="dt"><b>${num(dt.getDate())}</b><span>${fmt(dt,{month:"short"})} · ${fmt(dt,{weekday:"short"})}</span></div></div>
        <div style="min-width:0">
          <h5>${esc(e.name[L()])}</h5>
          <div class="badges">${st}${soon}</div>
          <div class="when">${when}${dd>=0&&dd>14?` · ${t().inDays(num(dd))}`:""}${e.src&&/^https:\/\//.test(e.src)?` · <a href="${esc(e.src)}" target="_blank" rel="noopener">${t().source}</a>`:""}</div>
          ${hist}
          <div class="wear">${esc(pick(e,"wear",k.gender))}</div>
          <div class="sw" aria-hidden="true">${e.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</div>
          <div class="chips">${(e["buy"+(k.gender==="b"?"B":"G")]||e.buy)[L()].map(b=>`<span>${esc(b)}</span>`).join("")}<span>${t().size(num(k.age))}</span></div>
          <div class="links">${dd>=0?buy(e):""}
            ${canWrite&&!k.example?`<button class="btn sm" data-open="${e.id}">${e.confirmed?t().editDate:t().haveDate}</button>`:""}
            ${flash===e.id?`<span class="msg">${t().saved}</span>`:""}</div>
        </div>
        ${openForm===e.id?`<form class="dform" data-form="${e.id}">
          <div><label class="l" for="d-${e.id}">${t().dateLbl}</label><input class="input" type="date" id="d-${e.id}" required value="${e.date}" min="2026-08-31" max="2027-07-02"></div>
          <div><label class="l" for="n-${e.id}">${t().noteLbl}</label><input class="input" id="n-${e.id}" maxlength="140" value="${esc(e.rnote)}" placeholder="${t().notePh}"></div>
          <div class="full"><button class="btn solid sm" type="submit">${t().save}</button><button class="btn sm" type="button" data-cancel>${t().cancel}</button></div></form>`:""}
      </article>`;
    });
    h+=`</div></section>`;
  });
  if(db&&!canWrite)h+=`<p class="note">${t().signin}</p>`;
  document.getElementById("view").innerHTML=h;
  const key=k.school+k.age+k.gender+(nx?nx.id+nx.date:"");
  if(nd>1&&key!==lastNextKey){countUp(document.getElementById("cnt"),nd)}
  lastNextKey=key;
}
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#ffcf3d","#ff6b57","#43b0f1","#1fae6b","#ef5a8d","#7a5cf0"];
  for(let i=0;i<46;i++){const c=document.createElement("i");c.className="cf";c.style.left=(Math.random()*100)+"vw";c.style.background=cols[i%cols.length];
    c.style.setProperty("--x",(Math.random()*160-80)+"px");c.style.setProperty("--r",(Math.random()*900-450)+"deg");c.style.setProperty("--t",(1.2+Math.random()*1.2)+"s");c.style.animationDelay=(Math.random()*.25)+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),3000)}
}
function renderAll(){renderChrome();renderKids();renderForm();renderView()}

document.querySelector(".lang").addEventListener("click",ev=>{const b=ev.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;persist();renderAll()});
document.getElementById("kids").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-kid]");
  if(b){const i=+b.dataset.kid;if(i===active&&kids.length){editing=i}else{active=i;editing=null}persist();subscribe();renderAll();return}
  if(ev.target.closest("[data-add]")){editing=-1;renderForm();const n=document.getElementById("k-name");if(n)n.focus()}
});
document.getElementById("formHost").addEventListener("click",ev=>{
  if(ev.target.closest("[data-cancel-kid]")){editing=null;renderForm()}
  if(ev.target.closest("[data-remove-kid]")){kids.splice(editing,1);active=0;editing=null;persist();subscribe();renderAll()}
});
document.getElementById("formHost").addEventListener("submit",ev=>{
  ev.preventDefault();
  const k={name:document.getElementById("k-name").value.trim().slice(0,30),school:document.getElementById("k-school").value,age:+document.getElementById("k-age").value,gender:document.querySelector('input[name="k-g"]:checked').value};
  if(editing>=0){kids[editing]=k;active=editing}else{kids.push(k);active=kids.length-1}
  editing=null;persist();subscribe();renderAll();
});
document.getElementById("view").addEventListener("click",ev=>{
  const o=ev.target.closest("[data-open]");if(o){openForm=o.dataset.open;flash=null;renderView();const i=document.getElementById("d-"+openForm);if(i)i.focus();return}
  if(ev.target.closest("[data-cancel]")){openForm=null;renderView()}
});
document.getElementById("view").addEventListener("submit",async ev=>{
  ev.preventDefault();const f=ev.target.closest("[data-form]");if(!f)return;
  const id=f.dataset.form,k=curKid();
  const date=document.getElementById("d-"+id).value,note=document.getElementById("n-"+id).value.trim().slice(0,140);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
  try{
    if(db){await db.doc("reports/"+k.school+"__"+id).set({school:k.school,event:id,date,note,at:new Date().toISOString()})}
    else{const r=await fetch(API+"/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({school:k.school,event:id,date,note})});if(!r.ok)throw 0;const j=await r.json();reports[id]=j.report}
    openForm=null;flash=id;renderView();burst()}
  catch(e){canWrite=false;openForm=null;renderView()}
});
function subscribe(){
  const sid=curKid().school;
  if(sid===subSchool)return;
  subSchool=sid;reports={};history={};
  if(unsubR){unsubR();unsubR=null}if(unsubH){unsubH();unsubH=null}
  if(!db){STATIC.reports.filter(x=>x.school===sid).forEach(x=>reports[x.event]=x);STATIC.history.filter(x=>x.school===sid).forEach(x=>history[x.event]=x);
    if(/^https?:$/.test(location.protocol)&&!/claudeusercontent|claude\.ai/.test(location.hostname))fetch(API+"/reports?school="+encodeURIComponent(sid)).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(sid!==curKid().school)return;(j.reports||[]).forEach(x=>{if(x&&x.event)reports[x.event]=x});canWrite=true;renderView()}).catch(()=>{});
    return}
  unsubR=db.collection("reports").where("school","==",sid).onSnapshot(snap=>{if(sid!==curKid().school)return;const r={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.event)r[x.event]=x});reports=r;renderView()},()=>{});
  unsubH=db.collection("history").where("school","==",sid).onSnapshot(snap=>{if(sid!==curKid().school)return;const r={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.event)r[x.event]=x});history=r;renderView()},()=>{});
}
subscribe();renderAll();
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d)return;db=d;const cw=u&&u.can?await u.can("data.write"):null;canWrite=cw!==false;subSchool=null;subscribe();renderView();
  }catch(e){}
})();
</script>
