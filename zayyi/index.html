<style>
/* Layout: app shell — slim top bar, child switcher, a bold "next dress-up day" card, then a month-by-month timeline */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --raise:#f7f8f6; --ink:#13203a; --muted:#5b6679; --line:#e0e4e6;
  --accent:#0d7a63; --accent-soft:#dcefe9; --on-accent:#ffffff;
  --pop:#ff6a48; --pop-soft:#ffe6df; --on-pop:#2a0d06;
  --sure:#0d7a63; --sure-bg:#dcefe9; --guess:#8a5a00; --guess-bg:#fbefd4;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131e; --surface:#151d2b; --raise:#1b2536; --ink:#e8edf5; --muted:#97a3b6; --line:#263247;
  --accent:#3fc9a4; --accent-soft:#163a33; --on-accent:#05211a;
  --pop:#ff8a6c; --pop-soft:#3a2119; --on-pop:#2a0d06;
  --sure:#7fe0c3; --sure-bg:#163a33; --guess:#f2c46b; --guess-bg:#3a2d10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131e; --surface:#151d2b; --raise:#1b2536; --ink:#e8edf5; --muted:#97a3b6; --line:#263247;
  --accent:#3fc9a4; --accent-soft:#163a33; --on-accent:#05211a;
  --pop:#ff8a6c; --pop-soft:#3a2119; --on-pop:#2a0d06;
  --sure:#7fe0c3; --sure-bg:#163a33; --guess:#f2c46b; --guess-bg:#3a2d10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 56px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.logo small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);display:block;line-height:1}
.lang{margin-inline-start:auto;display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{padding-block:34px 18px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6.4vw,50px);line-height:1.12;letter-spacing:-.02em;margin:0;max-width:16ch;text-wrap:balance}
.hero p{color:var(--muted);margin:12px 0 0;max-width:58ch;font-size:16px}

/* kids */
.kids{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px}
.kid{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;text-align:start}
[dir="rtl"] .kid{padding:5px 5px 5px 14px}
.kid[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.kid .t{line-height:1.25}
.kid .t b{display:block;font-size:14px}
.kid .t span{font-size:12px;color:var(--muted)}
.add{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--ink)}
.example{margin-top:12px;font-size:13px;color:var(--muted)}

/* form card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.kidform{margin-top:16px}
.kidform h2{font-family:var(--display);font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.input,select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.seg{display:flex;gap:8px}
.seg label{flex:1;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--raise);font-weight:600}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 12px;font-size:13px}

/* next card */
.next{margin-top:18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);border-radius:calc(var(--r) + 4px);overflow:hidden;background:var(--pop);color:var(--on-pop)}
@media (max-width:720px){.next{grid-template-columns:1fr}}
.next .a{padding:24px}
.next .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.next h2{font-family:var(--display);font-size:clamp(26px,5vw,38px);line-height:1.15;margin:6px 0 8px;letter-spacing:-.01em}
.next .fit{font-size:15px;max-width:46ch}
.next .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.next .acts a{background:var(--on-pop);color:var(--pop);text-decoration:none;font-weight:700;border-radius:999px;padding:9px 16px;font-size:14px}
.next .acts a.alt{background:transparent;color:var(--on-pop);border:1px solid var(--on-pop)}
.next .b{background:color-mix(in srgb,var(--on-pop) 8%,transparent);padding:24px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-inline-start:1px solid color-mix(in srgb,var(--on-pop) 18%,transparent)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(56px,11vw,88px);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.next .b small{font-size:14px;font-weight:600}
.next .b .dd{margin-top:10px;font-size:14px;opacity:.85}

.meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-top:30px}
.meta h3{font-family:var(--display);font-size:22px;margin:0}
.meta span{color:var(--muted);font-size:14px}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px;max-width:360px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.progress{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* timeline */
.month{margin-top:26px}
.month h4{font-family:var(--display);font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:.02em}
.list{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ev.past{opacity:.55}
.ev.is-next{border-color:var(--pop);box-shadow:0 0 0 1px var(--pop)}
.date{text-align:center;border-radius:14px;background:var(--raise);padding:8px 4px;align-self:start;font-variant-numeric:tabular-nums}
.date .d{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.date .m{font-size:12px;color:var(--muted);margin-top:2px}
.date .w{font-size:11px;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ev h5{margin:0;font-family:var(--display);font-size:17px;font-weight:600}
.badge{font-size:12px;border-radius:999px;padding:1px 10px;font-weight:600}
.b-sure{background:var(--sure-bg);color:var(--sure)}
.b-guess{background:var(--guess-bg);color:var(--guess)}
.sw{display:flex}
.sw i{width:15px;height:15px;border-radius:50%;border:2px solid var(--surface);display:block;margin-inline-start:-4px}
.sw i:first-child{margin-inline-start:0}
.when{color:var(--muted);font-size:13px;margin-top:2px}
.when a,.hist a{color:var(--accent);font-weight:600}
.hist{font-size:13px;color:var(--muted);margin-top:4px}
.wear{margin-top:10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px;font-size:14px}
.links a{color:var(--accent);font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.dform{margin-top:12px;display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:10px;background:var(--raise);border:1px dashed var(--line);border-radius:14px;padding:12px}
.dform .full{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.dform{grid-template-columns:1fr}}
.msg{font-size:13px;color:var(--sure);font-weight:600}
.note{color:var(--muted);font-size:13px;margin-top:14px}

/* how */
.how{margin-top:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.how{grid-template-columns:1fr}}
.how .card{padding:18px}
.how .n{font-family:var(--display);font-weight:700;color:var(--accent);font-size:13px}
.how h6{font-family:var(--display);font-size:16px;margin:4px 0 4px}
.how p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:36px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px}
footer ul{padding-inline-start:18px;margin:6px 0}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.kid,.btn,.lang button{transition:background .15s,box-shadow .15s}}
</style>
</head>

        <div class="date"><div class="d">${num(dt.getDate())}</div><div class="m">${fmt(dt,{month:"short"})}</div><div class="w">${fmt(dt,{weekday:"short"})}</div></div>
        <div>
          <div class="top"><h5>${esc(e.name[L()])}</h5>${badge}<span class="sw" aria-hidden="true">${e.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</span></div>
          <div class="when">${when}${dd>=0?` · ${t().inDays(num(dd))}`:""}${e.src&&/^https:\/\//.test(e.src)?` · <a href="${esc(e.src)}" target="_blank" rel="noopener">${t().source}</a>`:""}</div>
          ${hist}
          <div class="wear">${esc(pick(e,"wear",k.gender))}</div>
          <div class="chips">${(e["buy"+(k.gender==="b"?"B":"G")]||e.buy)[L()].map(b=>`<span>${esc(b)}</span>`).join("")}<span>${t().size(num(k.age))}</span></div>
          <div class="links">
            <a href="https://www.amazon.ae/s?k=${encodeURIComponent(query(e,k))}" target="_blank" rel="noopener">${t().amazon}</a>
            <a href="https://www.noon.com/uae-en/search/?q=${encodeURIComponent(query(e,k))}" target="_blank" rel="noopener">${t().noon}</a>
            ${canWrite&&!k.example?`<button class="btn sm" data-open="${e.id}">${e.confirmed?t().editDate:t().haveDate}</button>`:""}
            ${flash===e.id?`<span class="msg">${t().saved}</span>`:""}
          </div>
          ${openForm===e.id?`<form class="dform" data-form="${e.id}">
            <div><label class="l" for="d-${e.id}">${t().dateLbl}</label><input class="input" type="date" id="d-${e.id}" required value="${e.date}" min="2026-08-31" max="2027-07-02"></div>
            <div><label class="l" for="n-${e.id}">${t().noteLbl}</label><input class="input" id="n-${e.id}" maxlength="140" value="${esc(e.rnote)}" placeholder="${t().notePh}"></div>
            <div class="full"><button class="btn solid sm" type="submit">${t().save}</button><button class="btn sm" type="button" data-cancel>${t().cancel}</button></div></form>`:""}
        </div></article>`;
    });
    h+=`</div></section>`;
  });
  if(db&&!canWrite)h+=`<p class="note">${t().signin}</p>`;
  document.getElementById("view").innerHTML=h;
}
function renderAll(){renderChrome();renderKids();renderForm();renderView()}

document.querySelector(".lang").addEventListener("click",ev=>{const b=ev.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;persist();renderAll()});
document.getElementById("kids").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-kid]");
  if(b){const i=+b.dataset.kid;if(i===active&&kids.length){editing=i}else{active=i;editing=null}persist();subscribe();renderAll();return}
  if(ev.target.closest("[data-add]")){editing=-1;renderForm();const n=document.getElementById("k-name");if(n)n.focus()}
});
document.getElementById("formHost").addEventListener("click",ev=>{
  if(ev.target.closest("[data-cancel-kid]")){editing=null;renderForm()}
  if(ev.target.closest("[data-remove-kid]")){kids.splice(editing,1);active=0;editing=null;persist();subscribe();renderAll()}
});
document.getElementById("formHost").addEventListener("submit",ev=>{
  ev.preventDefault();
  const k={name:document.getElementById("k-name").value.trim().slice(0,30),school:document.getElementById("k-school").value,age:+document.getElementById("k-age").value,gender:document.querySelector('input[name="k-g"]:checked').value};
  if(editing>=0){kids[editing]=k;active=editing}else{kids.push(k);active=kids.length-1}
  editing=null;persist();subscribe();renderAll();
});
document.getElementById("view").addEventListener("click",ev=>{
  const o=ev.target.closest("[data-open]");if(o){openForm=o.dataset.open;flash=null;renderView();const i=document.getElementById("d-"+openForm);if(i)i.focus();return}
  if(ev.target.closest("[data-cancel]")){openForm=null;renderView()}
});
document.getElementById("view").addEventListener("submit",async ev=>{
  ev.preventDefault();const f=ev.target.closest("[data-form]");if(!f)return;
  const id=f.dataset.form,k=curKid();
  const date=document.getElementById("d-"+id).value,note=document.getElementById("n-"+id).value.trim().slice(0,140);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
  try{
    if(db){await db.doc("reports/"+k.school+"__"+id).set({school:k.school,event:id,date,note,at:new Date().toISOString()})}
    else{const r=await fetch(API+"/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({school:k.school,event:id,date,note})});if(!r.ok)throw 0;const j=await r.json();reports[id]=j.report}
    openForm=null;flash=id;renderView()}
  catch(e){canWrite=false;openForm=null;renderView()}
});
function subscribe(){
  const sid=curKid().school;
  if(sid===subSchool)return;
  subSchool=sid;reports={};history={};
  if(unsubR){unsubR();unsubR=null}if(unsubH){unsubH();unsubH=null}
  if(!db){STATIC.reports.filter(x=>x.school===sid).forEach(x=>reports[x.event]=x);STATIC.history.filter(x=>x.school===sid).forEach(x=>history[x.event]=x);
    fetch(API+"/reports?school="+encodeURIComponent(sid)).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(sid!==curKid().school)return;(j.reports||[]).forEach(x=>{if(x&&x.event)reports[x.event]=x});canWrite=true;renderView()}).catch(()=>{});
    return}
  unsubR=db.collection("reports").where("school","==",sid).onSnapshot(snap=>{if(sid!==curKid().school)return;const r={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.event)r[x.event]=x});reports=r;renderView()},()=>{});
  unsubH=db.collection("history").where("school","==",sid).onSnapshot(snap=>{if(sid!==curKid().school)return;const r={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.event)r[x.event]=x});history=r;renderView()},()=>{});
}
subscribe();renderAll();
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d)return;db=d;const cw=u&&u.can?await u.can("data.write"):null;canWrite=cw!==false;subSchool=null;subscribe();renderView();
  }catch(e){}
})();
</script>

</body>
