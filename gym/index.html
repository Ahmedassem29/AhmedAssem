const EX=[{"id":"chest_press","name":"تشيست برس جهاز","en":"Matrix Ultra Converging Chest Press","group":"chest","slot":"chest_h","type":"machine","seen":"0:40","compound":true,"lvl":0,"avoid":[],"setup":["ظبّط الكرسي بحيث المقابض تبقى في مستوى منتصف صدرك.","ضهرك كله لازق في المسند، ورجلك ثابتة على الأرض."],"how":["ادفع المقابض لقدام لحد ما دراعك تتفرد من غير ما تقفل الكوع.","ارجع ببطء (حوالي 2 ثانية) لحد ما تحس بشد خفيف في الصدر."],"tips":["كتفك لتحت ولورا طول الوقت، ماتطلعهوش ناحية ودنك.","طلّع النفس وانت بتدفع."],"enHow":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.","Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"muscles":["chest"],"similar":false,"muscles2":["shoulders","triceps"],"yq":"Matrix Versa Converging Chest Press how to use","vid":{"id":"WHjKUg5-LUY","t":0,"title":"Ultra Series | Converging Chest Press","ch":"Matrix Fitness","dur":"0:38","official":true},"photo":"https://assets.jhtbrand.co/files/product/323e9e0156e491ca216b7354178d3a4c87d38676/","pkind":"p","model":"Matrix Ultra G7-S13 Converging Chest Press"},{"id":"vertical_chest_press","name":"تشيست برس بالبلِيتس","en":"Matrix Magnum Vertical Bench Press","group":"chest","slot":"chest_h","type":"plate","seen":"3:40","compound":true,"lvl":0,"avoid":[],"setup":["حط نفس الوزن على الناحيتين.","المقابض في مستوى منتصف الصدر، والضهر على المسند."],"how":["ادفع لقدام بالدراعين مع بعض.","ارجع ببطء لحد ما الكوع يبقى ورا جسمك بشوية."],"tips":["الجهاز ده بيسمحلك تشتغل بكل دراع لوحده لو حابب تصلّح فرق القوة.","ماتفردش الكوع لآخره بقوة."],"enHow":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.","Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"muscles":["chest"],"similar":true,"muscles2":["shoulders","triceps"],"yq":"Matrix Magnum Vertical Chest Press how to use","vid":{"id":"Brj-gEtVXXg","t":0,"title":"Magnum Vertical Bench Press — How to Use","ch":"Matrix Fitness","dur":"0:51","official":true},"photo":"https://i.ytimg.com/vi/Brj-gEtVXXg/maxresdefault.jpg","pkind":"v","model":"Matrix Magnum Vertical Bench Press"},{"id":"incline_press","name":"إنكلاين برس جهاز","en":"Incline Press (plate-loaded)","group":"chest","slot":"chest_inc","type":"plate","seen":"3:44","compound":true,"lvl":0,"avoid":["shoulder"],"setup":["الكرسي بحيث المقابض تبقى عند أعلى الصدر.","ضهرك ورأسك على المسند المايل."],"how":["ادفع لفوق ولقدام في خط مايل.","انزل ببطء لحد ما إيدك توصل قريب من أعلى صدرك."],"tips":["ده بيركز على الجزء العلوي من الصدر.","خلي الكوع بزاوية حوالي 45 درجة من جسمك، مش مفرود للجنب."],"enHow":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"muscles":["chest"],"similar":false,"muscles2":["shoulders","triceps"],"yq":"Matrix Magnum Incline Press how to use","vid":{"id":"F1HgGsrf5tQ","t":0,"title":"Matrix Incline Chest Press Machine","ch":"Arman Eckelbarger","dur":"0:54","official":false},"photo":"https://i.ytimg.com/vi/F1HgGsrf5tQ/hqdefault.jpg","pkind":"v"},{"id":"decline_press","name":"ديكلاين برس جهاز","en":"Decline Press (plate-loaded)","group":"chest","slot":"chest_h","type":"plate","seen":"4:00","compound":true,"lvl":0,"avoid":[],"setup":["المقابض تبقى في مستوى أسفل الصدر.","ضهرك على المسند."],"how":["ادفع لقدام ولتحت شوية.","ارجع ببطء."],"tips":["بيركز على الجزء السفلي من الصدر، وبيكون أريح على الكتف من البنش العادي."],"enHow":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"muscles":["chest"],"similar":false,"muscles2":["shoulders","triceps"],"yq":"Matrix Magnum Decline Press how to use"},{"id":"bench_press","name":"بنش برس بالبار","en":"Barbell Bench Press","group":"chest","slot":"chest_h","type":"free","seen":"5:48","compound":true,"lvl":1,"avoid":["shoulder"],"setup":["نام على البنش وعينك تحت البار بالظبط.","امسك البار أعرض من كتفك بشوية، ورجلك ثابتة على الأرض.","ابدأ بوزن خفيف، ويفضل حد يسبّتك (يقف وراك)."],"how":["نزّل البار ببطء لحد ما يلمس منتصف صدرك.","ادفعه لفوق في خط مستقيم."],"tips":["ضم لوحي الكتف لورا، وخلي فيه تقويسة خفيفة في أسفل الضهر.","ماتخبطش البار في صدرك."],"enHow":["Lie back on a flat bench. Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","From the starting position, breathe in and begin coming down slowly until the bar touches your middle chest.","After a brief pause, push the bar back to the starting position as you breathe out. Focus on pushing the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position at the top of the motion, hold for a second and then start coming down slowly again. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"muscles":["chest"],"similar":false,"muscles2":["shoulders","triceps"],"yq":"Barbell Bench Press how to use","vid":{"id":"lWFknlOTbyM","t":61,"title":"Barbell Bench Press — 2 Minute Tutorial","ch":"Max Euceda","dur":"2:00","official":false},"photo":"https://i.ytimg.com/vi/lWFknlOTbyM/hqdefault.jpg","pkind":"v"},{"id":"incline_db","name":"إنكلاين دمبل برس","en":"Incline Dumbbell Press","group":"chest","slot":"chest_inc","type":"free","seen":"6:16","compound":true,"lvl":1,"avoid":["shoulder"],"setup":["ظبّط البنش على زاوية 30 لـ 45 درجة.","اقعد والدمبلز على رجلك، وبعدين نام بيهم لورا."],"how":["ادفع الدمبلز لفوق لحد ما يقربوا من بعض.","انزل ببطء لحد ما الدمبل يبقى جنب صدرك."],"tips":["ماتخبطش الدمبلز في بعض فوق.","الكوع بزاوية 45 درجة من جسمك."],"enHow":["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."],"muscles":["chest"],"similar":false,"muscles2":["shoulders","triceps"],"yq":"Incline Dumbbell Press how to use","vid":{"id":"IP4oeKh1Sd4","t":57,"title":"Incline Dumbbell Bench Press — 2 Minute Tutorial","ch":"Max Euceda","dur":"2:00","official":false},"photo":"https://i.ytimg.com/vi/IP4oeKh1Sd4/hqdefault.jpg","pkind":"v"},{"id":"pec_fly","name":"بيك فلاي (فراشة)","en":"Matrix Ultra Pec Fly / Rear Delt","group":"chest","slot":"chest_fly","type":"machine","seen":"0:56","compound":false,"lvl":0,"avoid":[],"setup":["الكرسي بحيث المقابض في مستوى صدرك.","اختار وضع المقابض الخاص بالصدر (للأمام)."],"how":["ضم دراعاتك قدامك في شكل حضن، والكوع منحني شوية.","ارجع ببطء لحد ما تحس بفتح في الصدر."],"tips":["ماترجعش أبعد من مستوى كتفك.","اعصر الصدر ثانية لما الإيدين يقربوا من بعض."],"enHow":["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."],"muscles":["chest"],"similar":false,"muscles2":[],"yq":"Matrix Versa Pec Fly Rear Delt how to use","vid":{"id":"xWEtTqJxRbk","t":0,"title":"Ultra Series | Pec Fly / Rear Delt","ch":"Matrix Fitness","dur":"1:04","official":true},"photo":"https://assets.jhtbrand.co/files/product/9d5891d4b3fe860ca0e5cc8294ce5772779b348a/","pkind":"p","model":"Matrix Ultra G7-S22 Pec Fly / Rear Delt"},{"id":"cable_fly","name":"كابل كروس أوفر","en":"Cable Crossover","group":"chest","slot":"chest_fly","type":"cable","seen":"4:32","compound":false,"lvl":1,"avoid":[],"setup":["حط البكرتين فوق، وامسك مقبض في كل إيد.","خطوة لقدام، ورجل قدام التانية للتوازن."],"how":["انزل بإيديك لقدام ولتحت لحد ما يتقابلوا قدام بطنك.","ارجع ببطء لحد ما تحس بفتح في الصدر."],"tips":["الكوع ثابت ومنحني شوية طول الحركة.","ماتميلش بجسمك كتير لقدام."],"enHow":["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.","Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the starting position and repeat the movement for the prescribed amount of repetitions."],"muscles":["chest"],"similar":false,"muscles2":["shoulders"],"yq":"cable crossover how to use","vid":{"id":"taI4XduLpTk","t":0,"title":"How to Do Cable Crossovers","ch":"LIVESTRONG","dur":"1:27","official":false},"photo":"https://i.ytimg.com/vi/taI4XduLpTk/hqdefault.jpg","pkind":"v"},{"id":"lat_pulldown","name":"لات بول داون","en":"Matrix Ultra Diverging Lat Pulldown","group":"back","slot":"back_v","type":"cable","seen":"0:32","compound":true,"lvl":0,"avoid":[],"setup":["ظبّط مسند الركبة بحيث رجلك تثبت تحته.","امسك البار أعرض من كتفك."],"how":["اسحب البار لتحت لحد أعلى صدرك، وانت مايل لورا شوية خفيفة.","اطلع ببطء لحد ما دراعك يتفرد."],"tips":["فكّر إنك بتسحب بالكوع مش بالإيد.","ماترجعش بجسمك لورا كتير، وماتسحبش ورا رقبتك."],"enHow":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"muscles":["lats"],"similar":false,"muscles2":["biceps","middle back","shoulders"],"yq":"Matrix Versa Lat Pulldown how to use","vid":{"id":"uoFjFcLIQec","t":0,"title":"Ultra Series | Diverging Lat Pulldown","ch":"Matrix Fitness","dur":"0:43","official":true},"photo":"https://assets.jhtbrand.co/files/product/e74ad7913759f0a6141d9629e704fc7af149d391/","pkind":"p","model":"Matrix Ultra G7-S33 Diverging Lat Pulldown"},{"id":"assisted_pullup","name":"عقلة بالمساعدة","en":"Matrix Chin / Dip Assist","group":"back","slot":"back_v","type":"machine","seen":"7:48","compound":true,"lvl":0,"avoid":["shoulder"],"setup":["اختار وزن المساعدة: كل ما الوزن يزيد، كل ما الجهاز يساعدك أكتر.","اركع على المسند وامسك المقابض اللي فوق."],"how":["اسحب جسمك لفوق لحد ما دقنك تعدّي المقابض.","انزل ببطء لحد ما دراعك يتفرد."],"tips":["كل ما تقوى، قلّل وزن المساعدة.","ماتتمرجحش."],"enHow":["Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.","Pull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.","Pull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.","After a brief pause, return to the starting position."],"muscles":["lats"],"similar":true,"muscles2":["abdominals","forearms","middle back"],"yq":"Matrix assisted chin up machine how to use","vid":{"id":"CCPFFukj7ss","t":0,"title":"Matrix Versa Chin / Dip Assist — Setup & Movements","ch":"Matrix Fitness","dur":"0:48","official":true},"photo":"https://assets.jhtbrand.co/files/product/2d3dfb6fb46aff91554a6d178fcaa6c12d1e85ce/","pkind":"p","model":"Matrix Chin / Dip Assist"},{"id":"iso_high_row","name":"هاي رو هامر سترينث","en":"Hammer Strength Iso-Lateral High Row","group":"back","slot":"back_v","type":"plate","seen":"7:00","compound":true,"lvl":0,"avoid":[],"setup":["ظبّط الكرسي بحيث صدرك على المسند والمقابض فوق قدامك.","رجلك تحت المسند."],"how":["اسحب المقابض لتحت ولورا ناحية صدرك.","ارجع ببطء لحد ما تحس بفرد في الضهر."],"tips":["تقدر تشتغل بدراع واحد كل مرة.","ضم لوحي الكتف في آخر الحركة."],"enHow":["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position.","For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"muscles":["middle back"],"similar":true,"muscles2":["lats"],"yq":"Hammer Strength Iso-Lateral High Row how to use","vid":{"id":"5vcDfRwVMSk","t":0,"title":"Hammer Strength Iso-Lateral High Row","ch":"Life Fitness / Hammer Strength","dur":"0:34","official":true},"photo":"https://i.ytimg.com/vi/5vcDfRwVMSk/maxresdefault.jpg","pkind":"v","model":"Hammer Strength Iso-Lateral High Row"},{"id":"seated_row","name":"سيتد رو جهاز","en":"Matrix Ultra Diverging Seated Row","group":"back","slot":"back_h","type":"machine","seen":"0:24","compound":true,"lvl":0,"avoid":[],"setup":["ظبّط مسند الصدر بحيث إيدك بالكاد توصل للمقابض ودراعك مفرود.","صدرك لازق في المسند."],"how":["اسحب المقابض لورا ناحية بطنك، والكوع قريب من جسمك.","ارجع ببطء لحد ما دراعك يتفرد."],"tips":["ضم لوحي الكتف لورا في آخر الحركة.","ماتبعدش صدرك عن المسند."],"enHow":["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"muscles":["lats"],"similar":false,"muscles2":["biceps","middle back"],"yq":"Matrix Versa Seated Row how to use","vid":{"id":"O90lC5WcIGE","t":0,"title":"Ultra Series | Diverging Seated Row","ch":"Matrix Fitness","dur":"0:36","official":true},"photo":"https://assets.jhtbrand.co/files/product/388229737c02e4a675585fd2f38a4550d302ba7e/","pkind":"p","model":"Matrix Ultra G7-S34 Diverging Seated Row"},{"id":"cable_row","name":"لو رو كابل","en":"Cable Low Row","group":"back","slot":"back_h","type":"cable","seen":"1:16","compound":true,"lvl":0,"avoid":["lowerback"],"setup":["اقعد ورجلك على المسند والركبة منحنية شوية.","امسك المقبض وضهرك مفرود."],"how":["اسحب المقبض لبطنك، وضهرك ثابت.","ارجع ببطء لحد ما دراعك يتفرد."],"tips":["ماتتمرجحش بضهرك لقدام ولورا.","صدرك لفوق طول الوقت."],"enHow":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"muscles":["middle back"],"similar":false,"muscles2":["biceps","lats","shoulders"],"yq":"seated cable row how to use","vid":{"id":"vwHG9Jfu4sw","t":47,"title":"Seated Cable Row — 2 Minute Tutorial","ch":"Max Euceda","dur":"2:00","official":false},"photo":"https://i.ytimg.com/vi/vwHG9Jfu4sw/hqdefault.jpg","pkind":"v"},{"id":"tbar_row","name":"تي بار رو","en":"Chest-Supported T-Bar Row","group":"back","slot":"back_h","type":"plate","seen":"5:20","compound":true,"lvl":0,"avoid":[],"setup":["اقف على المسند وصدرك على الوسادة.","امسك المقابض ودراعك مفرود."],"how":["اسحب لفوق ناحية صدرك، والكوع لورا.","انزل ببطء."],"tips":["صدرك لازق في الوسادة طول الوقت، وده بيحمي ضهرك.","جرّب المسكة الواسعة مرة والضيقة مرة."],"enHow":["Load up the T-bar Row Machine with the desired weight and adjust the leg height so that your upper chest is at the top of the pad. Tip: In some machines all you can do is stand on the appropriate step that allows you to be at a height that has the upper chest at the top of the pad.","Lay face down on the pad and grab the handles. You can either use a palms down, palms up, or palms in position depending on what part of your back you want to emphasize.","Lift the bar off the rack and extend your arms in front of you. This will be your starting position.","As you exhale slowly pull the weight up and squeeze your back at the top of the movement. Tip: Keep the upper arms as close to the torso as possible throughout the movement in order to better engage the back muscles. Also, do not lift your body off of the pad at any time and refrain from using the biceps to lift the weight.","After a second contraction at the top of the movement, as you inhale, slowly go back down to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["middle back"],"similar":true,"muscles2":["biceps","lats"],"yq":"chest supported T-bar row machine how to use","vid":{"id":"CRpez9nWVH0","t":0,"title":"Chest Supported T-Bar Row Tutorial","ch":"Prep Coach UK","dur":"0:34","official":false},"photo":"https://i.ytimg.com/vi/CRpez9nWVH0/hqdefault.jpg","pkind":"v"},{"id":"db_row","name":"وان آرم دمبل رو","en":"One-Arm Dumbbell Row","group":"back","slot":"back_h","type":"free","seen":"6:16","compound":true,"lvl":0,"avoid":[],"setup":["حط ركبة وإيد على البنش، والرجل التانية على الأرض.","ضهرك مفرود وموازي للأرض تقريبًا."],"how":["اسحب الدمبل ناحية وسطك، والكوع قريب من جسمك.","انزل ببطء لحد ما دراعك يتفرد."],"tips":["ماتلفّش جسمك وانت بتسحب.","خلّص كل العدّات بدراع، وبعدين بدّل."],"enHow":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions.","Switch sides and repeat again with the other arm."],"muscles":["middle back"],"similar":false,"muscles2":["biceps","lats","shoulders"],"yq":"One-Arm Dumbbell Row how to use","vid":{"id":"dFzUjzfih7k","t":0,"title":"Single Arm Dumbbell Row — 2 Minute Tutorial","ch":"Max Euceda","dur":"2:00","official":false},"photo":"https://i.ytimg.com/vi/dFzUjzfih7k/hqdefault.jpg","pkind":"v"},{"id":"back_ext","name":"باك إكستنشن 45°","en":"Matrix Magnum Back Extension","group":"back","slot":"hinge","type":"body","seen":"7:16","compound":false,"lvl":0,"avoid":["lowerback"],"setup":["ظبّط الوسادة بحيث حافتها تحت عضمة الحوض.","رجلك ثابتة تحت المسند."],"how":["انزل بجسمك لقدام وضهرك مفرود.","اطلع لحد ما جسمك يبقى خط مستقيم مع رجلك، مش أكتر."],"tips":["ماتقوّسش ضهرك لورا في الآخر.","لو بقت سهلة، امسك طارة على صدرك."],"enHow":["Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.","Adjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.","With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.","Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back.","Slowly raise your torso back to the initial position as you inhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.","Repeat for the recommended amount of repetitions."],"muscles":["lower back"],"similar":false,"muscles2":["glutes","hamstrings"],"yq":"45 degree back extension how to use","vid":{"id":"G6HG5VzJoNc","t":0,"title":"How to Perform a 45° Back Extension","ch":"Alexandra Yaeger","dur":"1:15","official":false},"photo":"https://assets.jhtbrand.co/files/product/318ab8fc7f88c1a97e326d0cf8a0cbecc5e28e92/","pkind":"p","model":"Matrix Magnum MG-A52 Back Extension"},{"id":"shoulder_press","name":"شولدر برس جهاز","en":"Matrix Ultra Converging Shoulder Press","group":"shoulders","slot":"sh_press","type":"machine","seen":"1:05","compound":true,"lvl":0,"avoid":["shoulder"],"setup":["ظبّط الكرسي بحيث المقابض تبقى في مستوى كتفك.","ضهرك على المسند."],"how":["ادفع لفوق لحد ما دراعك يتفرد تقريبًا.","انزل ببطء لمستوى الكتف."],"tips":["ماتقوّسش ضهرك.","ماتقفلش الكوع فوق."],"enHow":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.","Press the handles upward by extending through the elbow.","After a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"muscles":["shoulders"],"similar":false,"muscles2":["triceps"],"yq":"Matrix Versa Converging Shoulder Press how to use","vid":{"id":"zWVEKwAGdTc","t":0,"title":"Ultra Series | Converging Shoulder Press","ch":"Matrix Fitness","dur":"0:40","official":true},"photo":"https://assets.jhtbrand.co/files/product/bfc84f186e8d50e62ceb36869b62919ee94579ab/","pkind":"p","model":"Matrix Ultra G7-S23 Converging Shoulder Press"},{"id":"db_shoulder_press","name":"شولدر برس دمبل","en":"Seated Dumbbell Shoulder Press","group":"shoulders","slot":"sh_press","type":"free","seen":"6:16","compound":true,"lvl":1,"avoid":["shoulder"],"setup":["ظبّط البنش مستقيم (90 درجة).","ابدأ والدمبلز في مستوى كتفك."],"how":["ادفع لفوق لحد ما الدمبلز يقربوا من بعض.","انزل ببطء لمستوى الودن."],"tips":["ماتميلش لورا.","شد بطنك."],"enHow":["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.","Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.","Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.","Now, exhale and push the dumbbells upward until they touch at the top.","Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders"],"similar":false,"muscles2":["triceps"],"yq":"Seated Dumbbell Shoulder Press how to use","vid":{"id":"rO_iEImwHyo","t":41,"title":"Seated Dumbbell Shoulder Press — 2 Minute Tutorial","ch":"Max Euceda","dur":"2:00","official":false},"photo":"https://i.ytimg.com/vi/rO_iEImwHyo/hqdefault.jpg","pkind":"v"},{"id":"lateral_raise","name":"لاترال ريز جهاز","en":"Matrix Ultra Lateral Raise","group":"shoulders","slot":"sh_lat","type":"machine","seen":"1:00","compound":false,"lvl":0,"avoid":[],"setup":["ظبّط الكرسي بحيث مفصل الجهاز في نفس مستوى كتفك.","حط الوسادة على دراعك من بره."],"how":["ارفع دراعاتك للجنب لحد مستوى الكتف.","انزل ببطء."],"tips":["ماترفعش كتفك ناحية ودنك.","استخدم وزن خفيف وعدّات كتير."],"enHow":["Pick a couple of dumbbells and sit at the end of a flat bench with your feet firmly on the floor. Hold the dumbbells with your palms facing in and your arms straight down at your sides at arms' length. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["shoulders"],"similar":true,"muscles2":[],"yq":"Matrix Versa Lateral Raise how to use","vid":{"id":"7e_VVcPLgUo","t":0,"title":"Ultra Series | Lateral Raise","ch":"Matrix Fitness","dur":"0:35","official":true},"photo":"https://assets.jhtbrand.co/files/product/7704d5824a6b9afdf730d8b3d502d22ea1e47438/","pkind":"p","model":"Matrix Ultra G7-S21 Lateral Raise"},{"id":"rear_delt","name":"ريير ديلت (كتف خلفي)","en":"Matrix Ultra Pec Fly / Rear Delt","group":"shoulders","slot":"sh_rear","type":"machine","seen":"0:56","compound":false,"lvl":0,"avoid":[],"setup":["نفس جهاز البيك فلاي، بس اقعد ووشك ناحية المسند.","حط المقابض على الوضع الخلفي."],"how":["افتح دراعاتك للجنب ولورا ودراعك شبه مفرود.","ارجع ببطء."],"tips":["الحركة من الكتف، مش من الضهر.","وزن خفيف وتحكم كامل."],"enHow":["Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.","In a semicircular motion, pull your hands out to your side and back, contracting your rear delts.","Keep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.","Pause at the rear of the movement, and slowly return the weight to the starting position."],"muscles":["shoulders"],"similar":true,"muscles2":[],"yq":"Matrix Pec Fly Rear Delt machine rear delt how to use","vid":{"id":"xWEtTqJxRbk","t":0,"title":"Ultra Series | Pec Fly / Rear Delt","ch":"Matrix Fitness","dur":"1:04","official":true},"photo":"https://assets.jhtbrand.co/files/product/9d5891d4b3fe860ca0e5cc8294ce5772779b348a/","pkind":"p","model":"Matrix Ultra G7-S22 Pec Fly / Rear Delt"},{"id":"face_pull","name":"فيس بول كابل","en":"Cable Face Pull","group":"shoulders","slot":"sh_rear","type":"cable","seen":"4:32","compound":false,"lvl":0,"avoid":[],"setup":["حط البكرة في مستوى وشك، وركّب الحبل.","امسك الحبل وارجع خطوة لورا."],"how":["اسحب الحبل ناحية وشك، وافتح إيدك للجنب.","الكوع يبقى عالي في مستوى الكتف."],"tips":["ممتاز لصحة الكتف ووضع الجسم.","اثبت ثانية في آخر الحركة."],"enHow":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"muscles":["shoulders"],"similar":false,"muscles2":["middle back"],"yq":"cable face pull how to use","vid":{"id":"eTCBSFlCJ_s","t":0,"title":"How to do a Face Pull","ch":"NASM","dur":"0:26","official":false},"photo":"https://i.ytimg.com/vi/eTCBSFlCJ_s/hqdefault.jpg","pkind":"v"},{"id":"biceps_machine","name":"باي جهاز","en":"Matrix Ultra Biceps Curl","group":"biceps","slot":"bi","type":"machine","seen":"3:02","compound":false,"lvl":0,"avoid":[],"setup":["ظبّط الكرسي بحيث دراعك كله على الوسادة، والكوع عند مفصل الجهاز."],"how":["اطوي دراعك لفوق ناحية كتفك.","انزل ببطء لحد ما دراعك يتفرد تقريبًا."],"tips":["ماترفعش الكوع من على الوسادة.","اعصر العضلة ثانية فوق."],"enHow":["Sit down on the Preacher Curl Machine and select the weight.","Place the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.","Now lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"],"similar":false,"muscles2":[],"yq":"Matrix Versa Biceps Curl how to use","vid":{"id":"o5GIQhVHNhI","t":0,"title":"Ultra Series | Biceps Curl — Setup & Movements","ch":"Matrix Fitness","dur":"0:54","official":true},"photo":"https://assets.jhtbrand.co/files/product/edcf820acb4edc7e1934c3a6f318ab4cfb5a5047/","pkind":"p","model":"Matrix Ultra G7-S40 Biceps Curl"},{"id":"preacher_curl","name":"بريتشر كيرل","en":"Matrix Magnum Preacher Curl","group":"biceps","slot":"bi","type":"free","seen":"5:36","compound":false,"lvl":0,"avoid":[],"setup":["اقعد على البنش ودراعك ممدود على الوسادة المايلة.","امسك بار EZ أو دمبل."],"how":["اطوي لفوق لحد ما الوزن يقرب من كتفك.","انزل ببطء، ومن غير ما تقفل الكوع تحت."],"tips":["الجزء اللي تحت هو الأهم، فانزل ببطء."],"enHow":["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.","With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.","As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"],"similar":false,"muscles2":[],"yq":"Preacher Curl Bench how to use","vid":{"id":"9WDQqgiwQEY","t":0,"title":"Preacher Curl: Form & Tips","ch":"One Minute Tutorial","dur":"1:01","official":false},"photo":"https://assets.jhtbrand.co/files/product/8403e1794b33f6738fa72085b6a8e3eace525e16/","pkind":"p","model":"Matrix Magnum MG-A62 Preacher Curl"},{"id":"cable_curl","name":"باي كابل","en":"Cable Biceps Curl","group":"biceps","slot":"bi","type":"cable","seen":"4:32","compound":false,"lvl":0,"avoid":[],"setup":["حط البكرة تحت خالص وركّب البار.","اقف مفرود والكوع جنب جسمك."],"how":["اطوي لفوق ناحية كتفك.","انزل ببطء."],"tips":["الكوع ثابت جنب جسمك، ماتحركوش لقدام."],"enHow":["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the curl bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"],"similar":false,"muscles2":[],"yq":"cable biceps curl how to use","vid":{"id":"2MUEL4nL6hA","t":0,"title":"How to Properly Cable Bicep Curl","ch":"Colossus Fitness","dur":"1:13","official":false},"photo":"https://i.ytimg.com/vi/2MUEL4nL6hA/hqdefault.jpg","pkind":"v"},{"id":"hammer_curl","name":"هامر كيرل دمبل","en":"Dumbbell Hammer Curl","group":"biceps","slot":"bi","type":"free","seen":"6:16","compound":false,"lvl":0,"avoid":[],"setup":["امسك دمبل في كل إيد، وكف إيدك ناحية جسمك."],"how":["اطوي لفوق ومسكة الإيد زي ما هي.","انزل ببطء."],"tips":["بيشغّل عضلة الساعد كمان.","ماتتمرجحش بجسمك."],"enHow":["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.","After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["biceps"],"similar":false,"muscles2":[],"yq":"Dumbbell Hammer Curl how to use","vid":{"id":"OPqe0kCxmR8","t":26,"title":"Dumbbell Hammer Curls — Correct Technique","ch":"One Minute Tutorial","dur":"1:04","official":false},"photo":"https://i.ytimg.com/vi/OPqe0kCxmR8/hqdefault.jpg","pkind":"v"},{"id":"triceps_machine","name":"تراي جهاز","en":"Matrix Ultra Triceps Extension","group":"triceps","slot":"tri","type":"machine","seen":"0:08","compound":false,"lvl":0,"avoid":[],"setup":["ظبّط الكرسي بحيث الكوع على الوسادة وعند مفصل الجهاز."],"how":["افرد دراعك لتحت ولقدام لحد ما يتفرد خالص.","ارجع ببطء."],"tips":["الكوع ثابت على الوسادة.","اعصر التراي ثانية في الآخر."],"enHow":["Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.","Perform the movement by extending the elbow, pulling your lower arm away from your upper arm.","Pause at the completion of the movement, and then slowly return the weight to the starting position.","Avoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."],"muscles":["triceps"],"similar":false,"muscles2":[],"yq":"Matrix Versa Triceps Extension how to use","vid":{"id":"QW3v5sEaQyI","t":0,"title":"Ultra Series | Triceps Extension","ch":"Matrix Fitness","dur":"0:36","official":true},"photo":"https://assets.jhtbrand.co/files/product/e680d9c7abd9a90ac03afe477010e4a4232d900d/","pkind":"p","model":"Matrix Ultra G7-S45 Triceps Extension"},{"id":"pressdown","name":"تراي بوش داون كابل","en":"Cable Triceps Pressdown","group":"triceps","slot":"tri","type":"cable","seen":"5:12","compound":false,"lvl":0,"avoid":[],"setup":["حط البكرة فوق خالص، وركّب الحبل أو البار.","اقف ومِل لقدام شوية، والكوع جنب جسمك."],"how":["ادفع لتحت لحد ما دراعك يتفرد.","اطلع ببطء لحد ما الساعد يبقى موازي للأرض تقريبًا."],"tips":["الكوع مايتحركش، الساعد بس اللي بيتحرك."],"enHow":["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"muscles":["triceps"],"similar":false,"muscles2":[],"yq":"triceps rope pushdown how to use","vid":{"id":"vB5OHsJ3EME","t":0,"title":"How To: Rope Push-Down","ch":"ScottHermanFitness","dur":"1:33","official":false},"photo":"https://i.ytimg.com/vi/vB5OHsJ3EME/hqdefault.jpg","pkind":"v"},{"id":"dips","name":"متوازي بالمساعدة","en":"Matrix Chin / Dip Assist","group":"triceps","slot":"tri","type":"machine","seen":"7:48","compound":true,"lvl":0,"avoid":["shoulder"],"setup":["نفس جهاز العقلة بالمساعدة، بس امسك المقابض اللي تحت.","اختار وزن المساعدة واركع على المسند."],"how":["انزل لحد ما الكوع يبقى زاوية 90 درجة.","ادفع لفوق لحد ما دراعك يتفرد."],"tips":["جسمك مفرود عشان يركز على التراي، ولو ميّلته لقدام هيشتغل الصدر أكتر.","ماتنزلش أوطى من كده لو كتفك بيوجعك."],"enHow":["Sit securely in a dip machine, select the weight and firmly grasp the handles.","Now keep your elbows in at your sides in order to place emphasis on the triceps. The elbows should be bent at a 90 degree angle.","As you contract the triceps, extend your arms downwards as you exhale. Tip: At the bottom of the movement, focus on keeping a little bend in your arms to keep tension on the triceps muscle.","Now slowly let your arms come back up to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["triceps"],"similar":false,"muscles2":["chest","shoulders"],"yq":"Matrix assisted dip machine how to use","vid":{"id":"CCPFFukj7ss","t":0,"title":"Matrix Versa Chin / Dip Assist — Setup & Movements","ch":"Matrix Fitness","dur":"0:48","official":true},"photo":"https://assets.jhtbrand.co/files/product/2d3dfb6fb46aff91554a6d178fcaa6c12d1e85ce/","pkind":"p","model":"Matrix Chin / Dip Assist"},{"id":"leg_press","name":"ليج برس 45°","en":"Matrix Magnum 45° Leg Press","group":"quads","slot":"quad_main","type":"plate","seen":"9:44","compound":true,"lvl":0,"avoid":[],"setup":["اقعد وضهرك كله على المسند.","رجلك على اللوح بعرض الكتف تقريبًا.","فك الأمان بعد ما تفرد رجلك."],"how":["انزل باللوح ببطء لحد ما الركبة تبقى زاوية 90 درجة تقريبًا.","ادفع لفوق من كعب رجلك."],"tips":["ماتقفلش الركبة فوق خالص.","ماتخليش أسفل ضهرك يرتفع من على المسند تحت."],"enHow":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"muscles":["quadriceps"],"similar":false,"muscles2":["calves","glutes","hamstrings"],"yq":"45 degree leg press machine how to use","vid":{"id":"sI5PJZx73H8","t":0,"title":"Matrix Magnum 45° Leg Press — How to Use","ch":"Matrix Fitness","dur":"1:15","official":true},"photo":"https://i.ytimg.com/vi/sI5PJZx73H8/maxresdefault.jpg","pkind":"v","model":"Matrix Magnum 45° Leg Press"},{"id":"hack_squat","name":"هاك سكوات / V-Squat","en":"Hammer Strength V-Squat","group":"quads","slot":"quad_main","type":"plate","seen":"10:16","compound":true,"lvl":0,"avoid":["knee"],"setup":["ضهرك على المسند، وكتفك تحت الوسادات.","رجلك على اللوح بعرض الكتف، وفي النص أو أعلى شوية."],"how":["انزل ببطء لحد ما فخدك يبقى موازي للوح تقريبًا.","ادفع لفوق من كعبك."],"tips":["الركبة بتمشي في نفس اتجاه صوابع رجلك.","ماتخليش كعبك يرتفع."],"enHow":["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.","Position your legs in the platform using a shoulder width medium stance with the toes slightly pointed out. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).","Now straighten your legs without locking the knees. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the unit as you exhale by pushing the floor with mainly with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["quadriceps"],"similar":false,"muscles2":["calves","glutes","hamstrings"],"yq":"Hammer Strength V-Squat how to use","vid":{"id":"j6bEZhsOyVc","t":0,"title":"Hammer Strength V-Squat","ch":"Life Fitness / Hammer Strength","dur":"0:33","official":true},"photo":"https://i.ytimg.com/vi/j6bEZhsOyVc/maxresdefault.jpg","pkind":"v","model":"Hammer Strength V-Squat"},{"id":"pendulum_squat","name":"بندولوم سكوات","en":"Matrix Magnum Pendulum Squat","group":"quads","slot":"quad_main","type":"plate","seen":"8:48","compound":true,"lvl":1,"avoid":["knee"],"setup":["ضهرك على المسند وكتفك تحت الوسادات.","رجلك على اللوح المايل."],"how":["انزل لتحت عميق ببطء.","ادفع لفوق من نص رجلك."],"tips":["ممتاز للعضلة الأمامية، وأخف على الضهر من السكوات بالبار."],"enHow":["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.","Position your legs in the platform using a less than shoulder width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).","Now straighten your legs without locking the knees. This will be your starting position.","Begin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement.","Begin to raise the unit as you exhale by pushing the floor with mainly with the heels of your feet as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["quadriceps"],"similar":true,"muscles2":["calves","glutes","hamstrings"],"yq":"Matrix Magnum Pendulum Squat how to use","vid":{"id":"zXEJX3Ajudo","t":0,"title":"Matrix Magnum Pendulum Squat — How to Use","ch":"Matrix Fitness","dur":"1:12","official":true},"photo":"https://i.ytimg.com/vi/zXEJX3Ajudo/maxresdefault.jpg","pkind":"v","model":"Matrix Magnum Pendulum Squat"},{"id":"belt_squat","name":"بِلت سكوات","en":"Matrix Magnum Belt Squat","group":"quads","slot":"quad_main","type":"plate","seen":"9:00","compound":true,"lvl":0,"avoid":["knee"],"setup":["اربط الحزام حوالين وسطك ووصّله بالجهاز.","اقف على المنصة وامسك المسكة اللي قدامك."],"how":["انزل زي السكوات العادي وصدرك لفوق.","اطلع بدفع من رجلك."],"tips":["مافيش ضغط على الضهر خالص، ومناسب جدًا لو ضهرك تعبان."],"enHow":["To begin, first set the bar to a position that best matches your height. Once the bar is loaded, step under it and position it across the back of your shoulders.","Take the bar with your hands facing forward, unlock it and lift it off the rack by extending your legs.","Move your feet forward about 18 inches in front of the bar. Position your legs using a shoulder width stance with the toes slightly pointed out. Look forward at all times and maintain a neutral or slightly arched spine. This will be your starting position.","Slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper and lower leg breaks 90 degrees.","Begin to raise the bar as you exhale by pushing the floor with the heels of your feet, extending the knees and returning to the starting position.","Repeat for the recommended amount of repetitions."],"muscles":["quadriceps"],"similar":true,"muscles2":["calves","glutes","hamstrings"],"yq":"Matrix Magnum Belt Squat how to use","vid":{"id":"tY26yuax9VY","t":0,"title":"Matrix Plate-loaded Belt Squat — How to Use","ch":"Matrix Fitness","dur":"0:58","official":true},"photo":"https://i.ytimg.com/vi/tY26yuax9VY/maxresdefault.jpg","pkind":"v","model":"Matrix Magnum Belt Squat"},{"id":"goblet_squat","name":"جوبلت سكوات","en":"Goblet Squat","group":"quads","slot":"quad_main","type":"free","seen":"6:16","compound":true,"lvl":0,"avoid":["knee"],"setup":["امسك دمبل قدام صدرك بالإيدين.","رجلك أعرض من الكتف شوية، وصوابعك لبره شوية."],"how":["انزل لتحت كأنك بتقعد على كرسي.","اطلع وانت بتدفع من كعبك."],"tips":["صدرك لفوق وضهرك مفرود.","تمرين ممتاز للمبتدئين عشان تتعلم السكوات."],"enHow":["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.","Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.","At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."],"muscles":["quadriceps"],"similar":false,"muscles2":["calves","glutes","hamstrings","shoulders"],"yq":"Goblet Squat how to use","vid":{"id":"gCESNsDsbqk","t":0,"title":"Goblet Squats: Proper Form & Technique","ch":"BuiltLean","dur":"1:06","official":false},"photo":"https://i.ytimg.com/vi/gCESNsDsbqk/hqdefault.jpg","pkind":"v"},{"id":"leg_ext","name":"ليج إكستنشن","en":"Matrix Ultra Leg Extension","group":"quads","slot":"quad_iso","type":"machine","seen":"2:08","compound":false,"lvl":0,"avoid":["knee"],"setup":["ظبّط المسند بحيث ركبتك عند مفصل الجهاز بالظبط.","الوسادة على أسفل رجلك فوق الكاحل."],"how":["افرد رجلك لفوق لحد ما تتفرد.","انزل ببطء."],"tips":["اعصر العضلة ثانية فوق.","امسك المقابض اللي جنبك عشان تثبت."],"enHow":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."],"muscles":["quadriceps"],"similar":false,"muscles2":[],"yq":"Matrix Versa Leg Extension how to use","vid":{"id":"MoP3os3zYWI","t":0,"title":"Ultra Series | Leg Extension","ch":"Matrix Fitness","dur":"0:36","official":true},"photo":"https://assets.jhtbrand.co/files/product/44f487d03d6a5cb42e5192dc250cfab31bb4f4dd/","pkind":"p","model":"Matrix Ultra G7-S71 Leg Extension"},{"id":"seated_leg_curl","name":"ليج كيرل قاعد","en":"Matrix Ultra Seated Leg Curl","group":"hams","slot":"ham","type":"machine","seen":"2:44","compound":false,"lvl":0,"avoid":[],"setup":["ركبتك عند مفصل الجهاز.","الوسادة اللي تحت على أسفل سمانة رجلك، والوسادة اللي فوق على فخدك."],"how":["اطوي رجلك لتحت ولورا.","ارجع ببطء."],"tips":["ماترفعش وسطك من على الكرسي."],"enHow":["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.","Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.","As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"muscles":["hamstrings"],"similar":false,"muscles2":[],"yq":"Matrix Versa Seated Leg Curl how to use","vid":{"id":"FlcLl-lVVgY","t":0,"title":"Ultra Series | Seated Leg Curl","ch":"Matrix Fitness","dur":"0:50","official":true},"photo":"https://assets.jhtbrand.co/files/product/c6634bc030c9577d30b7087f5057a45aec845ccc/","pkind":"p","model":"Matrix Ultra G7-S72 Seated Leg Curl"},{"id":"lying_leg_curl","name":"ليج كيرل نايم","en":"Matrix Ultra Prone Leg Curl","group":"hams","slot":"ham","type":"machine","seen":"2:40","compound":false,"lvl":0,"avoid":[],"setup":["نام على بطنك والركبة بعد حافة البنش بشوية.","الوسادة فوق الكاحل من ورا."],"how":["اطوي رجلك لفوق ناحية المؤخرة.","انزل ببطء."],"tips":["وسطك لازق في البنش."],"enHow":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],"muscles":["hamstrings"],"similar":false,"muscles2":[],"yq":"Matrix Versa Prone Leg Curl how to use","vid":{"id":"rQage9oXFLM","t":0,"title":"Matrix Ultra Prone Leg Curl — Movements","ch":"Matrix Fitness","dur":"0:42","official":true},"photo":"https://assets.jhtbrand.co/files/product/6f9d3ecd61ff3ea390fb25871eaaeb55782f2152/","pkind":"p","model":"Matrix Ultra G7-S73 Prone Leg Curl"},{"id":"kneeling_leg_curl","name":"ليج كيرل راكع (رجل واحدة)","en":"Matrix Magnum Kneeling Leg Curl","group":"hams","slot":"ham","type":"plate","seen":"9:24","compound":false,"lvl":0,"avoid":["knee"],"setup":["اركع على المسند، والوسادة ورا كاحل الرجل اللي هتشتغل بيها."],"how":["اطوي رجلك لفوق.","انزل ببطء."],"tips":["كل رجل لوحدها بتصلّح فرق القوة بين الرجلين."],"enHow":["Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.","Keeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.","As you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.","Perform the same exercise now for the left leg."],"muscles":["hamstrings"],"similar":true,"muscles2":[],"yq":"Matrix Magnum Kneeling Leg Curl how to use","vid":{"id":"H24DTaxAXqo","t":0,"title":"Matrix Plate-loaded Kneeling Leg Curl","ch":"Matrix Fitness","dur":"0:49","official":true},"photo":"https://i.ytimg.com/vi/H24DTaxAXqo/maxresdefault.jpg","pkind":"v","model":"Matrix Magnum Kneeling Leg Curl"},{"id":"rdl","name":"رومانيان ديدلفت دمبل","en":"Dumbbell Romanian Deadlift","group":"hams","slot":"hinge","type":"free","seen":"6:16","compound":true,"lvl":1,"avoid":["lowerback"],"setup":["امسك دمبل في كل إيد، ورجلك بعرض الحوض."],"how":["ارجع بوسطك لورا والدمبلز ماشيين قريب من رجلك.","انزل لحد ما تحس بشد ورا الفخد.","اطلع وانت بتدفع وسطك لقدام."],"tips":["ضهرك مفرود طول الوقت، ماتقوّسهوش.","الركبة منحنية شوية وثابتة."],"enHow":["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."],"muscles":["hamstrings"],"similar":false,"muscles2":["glutes","lower back"],"yq":"Dumbbell Romanian Deadlift how to use ew feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.","Begin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips."],"muscles":["glutes"],"similar":true,"muscles2":["hamstrings","lower back"],"yq":"Matrix Magnum Standing Hip Thrust how to use","vid":{"id":"D5g5joMA3e0","t":0,"title":"Matrix Plate-loaded Standing Hip Thrust","ch":"Matrix Fitness","dur":"0:47","official":true},"photo":"https://i.ytimg.com/vi/D5g5joMA3e0/maxresdefault.jpg","pkind":"v","model":"Matrix Magnum Standing Hip Thrust"},{"id":"abductor","name":"أبدكتور (فتح الرجل)","en":"Matrix Ultra Hip Abduction","group":"glutes","slot":"abd","type":"machine","seen":"2:52","compound":false,"lvl":0,"avoid":[],"setup":["اقعد والوسادات على رجلك من بره عند الركبة."],"how":["افتح رجلك للجنب.","ارجع ببطء."],"tips":["مِل لقدام شوية عشان يشتغل الجزء العلوي من المؤخرة أكتر."],"enHow":["To begin, sit down on the abductor machine and select a weight you are comfortable with. When your legs are positioned properly, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them away from each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"muscles":["abductors"],"similar":false,"muscles2":["glutes"],"yq":"Matrix Versa Hip Abductor how to use","vid":{"id":"UvBINg1E4eU","t":0,"title":"Ultra Series | Hip Abductor","ch":"Matrix Fitness","dur":"0:44","official":true},"photo":"https://assets.jhtbrand.co/files/product/edd0fcf9258634765093efe3e01f8f364441e3e4/","pkind":"p","model":"Matrix Ultra G7-S75 Hip Abduction"},{"id":"adductor","name":"أدكتور (قفل الرجل)","en":"Matrix Ultra Hip Adduction","group":"glutes","slot":"add","type":"machine","seen":"2:32","compound":false,"lvl":0,"avoid":[],"setup":["اقعد والوسادات على رجلك من جوه.","ابدأ بفتحة تكون مريحة ليك."],"how":["اقفل رجلك لجوه.","افتح ببطء."],"tips":["ماتفتحش أكتر من اللي تقدر عليه."],"enHow":["To begin, sit down on the adductor machine and select a weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them towards each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary and avoid fast jerking motions in order to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"muscles":["adductors"],"similar":false,"muscles2":["glutes","hamstrings"],"yq":"Matrix Versa Hip Adductor how to use","vid":{"id":"FlnJ4sxbMr0","t":0,"title":"Ultra Series | Hip Adductor","ch":"Matrix Fitness","dur":"0:44","official":true},"photo":"https://assets.jhtbrand.co/files/product/8781392e7ba72bdc5c80ca38f40ca95c44f2b6df/","pkind":"p","model":"Matrix Ultra G7-S74 Hip Adduction"},{"id":"calf_press","name":"سمانة على الليج برس","en":"Matrix Magnum 45° Leg Press","group":"quads","slot":"calf","type":"plate","seen":"9:44","compound":false,"lvl":0,"avoid":[],"setup":["على جهاز الليج برس، حط مقدمة رجلك بس على طرف اللوح.","رجلك مفرودة."],"how":["ادفع بمقدمة رجلك لحد ما تقف على صوابعك.","انزل ببطء لحد ما تحس بفرد."],"tips":["ماتفكش الأمان وانت مش ماسك الوزن كويس.","عدّات كتير وببطء."],"enHow":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance.","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you without locking your knees. (Note: In some leg press units you can leave the safety bars on for increased safety. If your leg press unit allows for this, then this is the preferred method of performing the exercise.) Your torso and the legs should make perfect 90-degree angle. Now carefully place your toes and balls of your feet on the lower portion of the platform with the heels extending off. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Press on the platform by raising your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"muscles":["calves"],"similar":false,"muscles2":[],"yq":"calf press on leg press machine how to use","vid":{"id":"M4FojyRAcuE","t":0,"title":"Leg Press Calf Raise","ch":"Tiger Fitness","dur":"0:39","official":false},"photo":"https://i.ytimg.com/vi/sI5PJZx73H8/maxresdefault.jpg","pkind":"v","model":"Matrix Magnum 45° Leg Press"},{"id":"ab_crunch","name":"أب كرانش هامر سترينث","en":"Hammer Strength Abdominal Oblique Crunch","group":"core","slot":"core","type":"plate","seen":"7:40","compound":false,"lvl":0,"avoid":[],"setup":["اقعد وامسك المقابض اللي جنب راسك.","رجلك تحت الوسادات."],"how":["اطوي جسمك لقدام ولتحت بعضلة البطن.","ارجع ببطء."],"tips":["ماتشدّش بإيدك، البطن هي اللي بتشتغل.","طلّع النفس وانت نازل."],"enHow":["Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.","At the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.","After a second pause, slowly return to the starting position as you breathe in.","Repeat the movement for the prescribed amount of repetitions."],"muscles":["abdominals"],"similar":false,"muscles2":[],"yq":"Hammer Strength Abdominal Oblique Crunch how to use","vid":{"id":"n7BVPqR-Hhc","t":0,"title":"Hammer Strength Abdominal Oblique Crunch","ch":"Life Fitness / Hammer Strength","dur":"0:45","official":true},"photo":"https://i.ytimg.com/vi/n7BVPqR-Hhc/maxresdefault.jpg","pkind":"v","model":"Hammer Strength Abdominal Oblique Crunch"},{"id":"decline_situp","name":"سيت أب على بنش مايل","en":"Matrix Magnum Adjustable Ab Bench","group":"core","slot":"core","type":"body","seen":"9:08","compound":false,"lvl":0,"avoid":["lowerback"],"setup":["ثبّت رجلك تحت الوسادات.","إيدك على صدرك."],"how":["اطلع بجسمك لفوق بالبطن.","انزل ببطء من غير ما ترتاح خالص تحت."],"tips":["ابدأ بزاوية ميل قليلة."],"enHow":["Secure your legs at the end of the decline bench and lie down.","Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","While pushing the small of your back down in the bench to better isolate your abdominal muscles, begin to roll your shoulders off it.","Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the bench only about four inches, and your lower back should remain on the bench. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.","After the one second contraction, begin to come down slowly again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"muscles":["abdominals"],"similar":true,"muscles2":[],"yq":"decline sit up bench how to use","vid":{"id":"FRzQXeN1hro","t":0,"title":"Decline Crunch","ch":"MyTraining App","dur":"0:43","official":false},"photo":"https://assets.jhtbrand.co/files/product/3020965ee5be46eb024baccb8098324b71d761f9/","pkind":"p","model":"Matrix Magnum MG-A77 Adjustable Ab Bench"},{"id":"plank","name":"بلانك","en":"Plank","group":"core","slot":"core","type":"body","seen":"","compound":false,"lvl":0,"avoid":[],"timed":true,"setup":["على الأرض، على الكوعين وصوابع رجلك."],"how":["جسمك خط مستقيم من الراس للكعب.","اثبت للمدة المطلوبة وانت بتتنفس عادي."],"tips":["ماتنزلش وسطك لتحت، وماترفعوش لفوق."],"enHow":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."],"muscles":["abdominals"],"similar":false,"muscles2":[],"yq":"Plank how to use","vid":{"id":"mwlp75MS6Rg","t":0,"title":"How to do a Plank","ch":"NASM","dur":"0:15","official":false},"photo":"https://i.ytimg.com/vi/mwlp75MS6Rg/hqdefault.jpg","pkind":"v"},{"id":"air_bike","name":"إير بايك","en":"Air Bike","group":"cardio","slot":"cardio","type":"cardio","seen":"10:44","compound":false,"lvl":0,"avoid":[],"cardio":true,"setup":["ظبّط الكرسي بحيث رجلك تبقى شبه مفرودة تحت."],"how":["بدّل بين 30 ثانية سريع و60 ثانية هادي.","الإيدين بيزقوا ويشدوا مع الرجل."],"tips":["أحسن كارديو لحرق الدهون في وقت قليل."],"enHow":["To begin, seat yourself on the bike and adjust the seat to your height.","Select the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. The level of resistance can be changed throughout the workout. The handles can be used to monitor your heart rate to help you stay at an appropriate intensity."],"muscles":["quadriceps"],"similar":true,"muscles2":["calves","glutes","hamstrings"],"yq":"air bike assault bike how to use","vid":{"id":"KC-ZSfOmXgE","t":0,"title":"How to Use the Air Bike","ch":"Nutrition Warehouse","dur":"0:55","official":false},"photo":"https://i.ytimg.com/vi/KC-ZSfOmXgE/hqdefault.jpg","pkind":"v"},{"id":"incline_walk","name":"مشي على مشاية بميل","en":"Treadmill Incline Walk","group":"cardio","slot":"cardio","type":"cardio","seen":"10:40","compound":false,"lvl":0,"avoid":[],"cardio":true,"setup":["ميل 8–12% وسرعة 4.5–5.5 كم/س."],"how":["امشي من غير ما تمسك المشاية.","لازم تقدر تتكلم بس تكون بتنهج شوية."],"tips":["خفيف على الركبة ومفيد جدًا في التنشيف."],"enHow":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than walking outside. When walking, you should move at a moderate to fast pace, not a leisurely one. Being an activity of lower intensity, walking doesn't burn as many calories as some other activities, but still provides great benefit. A 150 lb person will burn about 175 calories walking 4 miles per hour for 30 minutes, compared to 450 calories running twice as fast. Maintain proper posture as you walk, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."],"muscles":["quadriceps"],"similar":true,"muscles2":["calves","glutes","hamstrings"],"yq":"incline treadmill walk how to use","vid":{"id":"9ccVxEvWtpA","t":0,"title":"How to Properly Walk on Incline","ch":"VIVE Health","dur":"0:45","official":false},"photo":"https://i.ytimg.com/vi/9ccVxEvWtpA/hqdefault.jpg","pkind":"v"}];

const weekNum = () => Math.floor((Date.now() - (S().start || Date.now())) / (7 * 864e5));
const candidates = (slot, st) => EX.filter(e => e.slot === slot && !(e.avoid || []).some(a => st.inj.includes(a)) && (st.level !== 'b' || e.lvl === 0));
const G = st => { const g = st.goals || ['muscle']; return { m: g.includes('muscle'), l: g.includes('loss'), f: g.includes('fit') }; };

function buildProgram(st) {
  const used = {}, wk = Math.floor(weekNum() / 4), g = G(st);
  return SPLITS[st.days].map((k, di) => {
    const n = COUNT[st.len] || 6; let slots = DAYS[k].slice(0, n);
    if (!slots.includes('core') && n >= 6 && DAYS[k].includes('core')) slots[slots.length - 1] = 'core';
    const items = [], taken = new Set();
    slots.forEach((slot, si) => {
      const c = candidates(slot, st).filter(e => !taken.has(e.id)); if (!c.length) return;
      used[slot] = used[slot] || 0;
      let ex = c[(used[slot] + wk + (st.days === 6 && di >= 3 ? 1 : 0)) % c.length]; used[slot]++;
      const sw = S().swaps[`${di}:${si}`]; if (sw && EXM[sw] && !taken.has(sw)) ex = EXM[sw];
      taken.add(ex.id); items.push({ id: ex.id, slot, si });

    if (st.cardio) {
      const id = (g.l && !g.f) ? (di % 2 === 0 ? 'incline_walk' : 'air_bike') : (di % 2 === 0 ? 'air_bike' : 'incline_walk');

}
function prescribe(ex, st) {
  const t = L(), g = G(st);

    if (st.len <= 45) mins = Math.round(mins * 0.7);
    return { sets: 1, reps: `${mins} ${t.min}`, rest: 0, note, cardio: true, mins };
  }
  if (ex.timed) return { sets: 3, reps: st.level === 'b' ? `20–30${t.sec}` : `40–60${t.sec}`, rest: 45, timed: true, hi: st.level === 'b' ? 30 : 60 };
  const c = ex.compound; let P;

  else P = c ? [3, 10, 12, 60] : [3, 12, 15, 45];

}
