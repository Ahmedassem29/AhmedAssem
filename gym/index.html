  if (a.startsWith('in-')) return;
  if (a.startsWith('set-') || a === 'save-settings' || a === 'lang') syncDraftInputs();
  switch (a) {
    case 'tab': tab = v; viewDay = null; draft = null; render(); top(); break;
    case 'lang': r.lang = v; save(); render(); break;
    case 'prof': if (st && st.active && +v !== r.cur) { /* keep running workout per profile */ } r.cur = +v; viewDay = null; openEx = null; rest = null; draft = null; save(); render(); break;
    case 'add-prof': draft = null; tab = 'new'; render(); top(); break;
    case 'del-prof': if (await ask(t.qDel(st.name), t.delP, t.no)) { r.profiles.splice(r.cur, 1); r.cur = 0; save(); draft = null; tab = 'today'; render(); } break;
    case 'set-goal': { const g = draft.goals; if (g.includes(v)) { if (g.length > 1) draft.goals = g.filter(x => x !== v); } else { draft.goals = [...g, v].slice(-2); } if (draft.goals.includes('loss') || draft.goals.includes('fit')) draft.cardio = true; render(); break; }
    case 'set-level': draft.level = v; render(); break;
    case 'set-days': draft.days = +v; render(); break;
    case 'set-len': draft.len = +v; render(); break;
    case 'set-inj': draft.inj = draft.inj.includes(v) ? draft.inj.filter(x => x !== v) : [...draft.inj, v]; render(); break;
    case 'set-cardio': draft.cardio = v === '1'; render(); break;
    case 'save-settings': {
      const name = (draft.name || '').trim(); if (!name) { ask(t.needName, t.ok); break; }
      const { name: _, ...settings } = draft;
      if (v === 'edit') { const old = st.settings; st.name = name; st.settings = settings; if (old.days !== settings.days) { st.rot = 0; st.swaps = {}; st.active = null; } }
      else { const p = newProfile(name); p.settings = settings; r.profiles.push(p); r.cur = r.profiles.length - 1; }
      draft = null; save(); tab = 'today'; render(); top(); break;
    }
    case 'reset': if (await ask(t.qReset, t.reset, t.no)) { const p = newProfile(st.name); p.id = st.id; p.settings = st.settings; r.profiles[r.cur] = p; save(); draft = null; tab = 'today'; render(); } break;
    case 'pick-day': viewDay = +v; openEx = null; render(); break;
    case 'go-day': if (st.active && st.active.di !== +v) { ask(t.qBusy, t.ok); break; } viewDay = +v; tab = 'today'; render(); top(); break;
    case 'toggle-ex': openEx = openEx === v ? null : v; mediaTab = 'vid'; render(); if (openEx) scrollToEx(v.split(':')[1]); break;
    case 'mtab': { mediaTab = v; const m = b.closest('.media'); m.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); m.querySelectorAll('.mt').forEach(x => x.hidden = !x.classList.contains('mt-' + v)); break; }
    case 'start': newSession(+v); render(); scrollToEx(0); break;
    case 'done-set': {
      const i = +b.dataset.i, si = +b.dataset.s, it = st.active.items[i], s = it.sets[si], ex = EXM[it.id], pr = prescribe(ex, st.settings);
      if (!s.done) {
        if (s.w == null || s.w === '') { const inp = document.querySelector(`[data-a="in-w"][data-i="${i}"][data-s="${si}"]`); if (inp && inp.placeholder !== '—') s.w = +inp.placeholder; }
        if (!pr.cardio && (s.r == null || s.r === '')) s.r = pr.hi;
        s.done = true; if (it.sets[si + 1] && it.sets[si + 1].w == null) it.sets[si + 1].w = s.w; save();
        const all = it.sets.every(x => x.done); if (all && st.active.items[i + 1]) { openEx = `${st.active.di}:${i + 1}`; mediaTab = 'vid'; }
        render(); startRest(all ? Math.min(pr.rest, 90) : pr.rest); if (all) scrollToEx(i + 1);
      } else { s.done = false; save(); render(); }
      break;
    }
    case 'add-set': st.active.items[+b.dataset.i].sets.push({ w: null, r: null, done: false }); save(); render(); break;
    case 'rm-set': st.active.items[+b.dataset.i].sets.pop(); save(); render(); break;
    case 'finish': {
      const A = st.active, day = buildProgram(st.settings)[A.di], n = A.items.reduce((k, it) => k + it.sets.filter(s => s.done).length, 0);
      if (!n && !(await ask(t.qEmpty, t.finish, t.no))) break;
      st.logs.push({ ts: Date.now(), di: A.di, key: day.key, dur: Math.round((Date.now() - A.t0) / 60000), items: A.items });
      st.rot = A.di + 1; st.active = null; viewDay = null; openEx = null; rest = null; save(); tab = 'prog'; render(); top(); setTimeout(() => toast(t.toast), 50); break;
    }
    case 'cancel': if (await ask(t.qCancel, t.cancel, t.no)) { st.active = null; rest = null; save(); render(); } break;
    case 'swap': swapSheet(+b.dataset.i); break;
    case 'do-swap': {
      const day = currentDay(buildProgram(st.settings)), i = +b.dataset.i, it = day.items[i];
      st.swaps[`${day.di}:${it.si}`] = v;
      if (st.active && st.active.di === day.di) { const pr = prescribe(EXM[v], st.settings); st.active.items[i] = { id: v, sets: Array.from({ length: pr.sets }, () => ({ w: null, r: null, done: false })) }; }
      save(); document.querySelector('.sheet')?.remove(); render(); break;
    }
    case 'play': { const t0 = b.dataset.t | 0; const f = document.createElement('div'); f.className = 'vframe'; f.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v}?start=${t0}&autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`; b.replaceWith(f); break; }
    case 'close-sheet': document.querySelector('.sheet')?.remove(); break;
    case 'lib-group': libGroup = v; render(); break;
    case 'lib-open': document.querySelector('.sheet')?.remove(); mediaTab = 'vid'; tab = 'ex:' + v; render(); top(); break;
    case 'rest-add': if (rest) { rest.end += 15000; rest.total += 15; } break;
    case 'rest-skip': rest = null; $('#rest').outerHTML = restBar(); break;
    case 'bw-add': { const x = $('#bwin'); const kg = +String(x.value).replace(',', '.').replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))); if (!kg || kg < 25 || kg > 300) break; st.weights = st.weights || []; st.weights.push({ ts: Date.now(), kg }); save(); render(); break; }
  }
});
document.addEventListener('input', ev => {
  const x = ev.target; if (!x.dataset || !x.dataset.a || !S() || !S().active) return;
  const s = S().active.items[+x.dataset.i].sets[+x.dataset.s];
  const val = x.value.replace(',', '.').replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  if (x.dataset.a === 'in-w') s.w = val === '' ? null : +val; else s.r = val === '' ? null : +val; save();
});
render();
}
