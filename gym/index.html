<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Double AA</title>
<meta name="theme-color" content="#070708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Double AA">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Alexandria:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a fight-poster gym app — black, blood red, hard edges
   IDEA: the gym wall graphics in Ahmed's own gym (PULL. LIFT. CONQUER.)
   PICTURE: his real machines, graded dark; real start/finish photos
   COLOUR+TYPE: near-black, white, one red; Anton + Alexandria 900
   LAYOUT: full-bleed hero, stacked cards, sticky bottom nav */
:root{--bg:#070708;--p:#111114;--p2:#18181d;--line:#25252c;--ink:#f4f4f6;--mut:#8b8b97;--red:#ff1f2d;--red2:#a3000c;--ok:#ff1f2d;
--cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Alexandria,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom));background-image:radial-gradient(120% 60% at 50% -10%,#2a0005 0%,transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.page{max-width:680px;margin:0 auto;padding:18px 16px 24px}
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;color:#fff;line-height:1;direction:ltr}
.logo small{font-family:Anton;font-size:10px;letter-spacing:.42em;color:#fff;margin:0 0 2px 4px}
.mark{width:64px;height:33px;display:block}
.disp{font-family:Anton,Alexandria,sans-serif;font-weight:900;letter-spacing:.01em;line-height:1.02;text-transform:uppercase;margin:0}
[lang=ar] .disp{font-family:Alexandria,Anton,sans-serif;font-weight:900;letter-spacing:0}
.ttl{font-family:Anton,Alexandria;font-weight:900;font-size:40px;line-height:1.05;margin:calc(10px + env(safe-area-inset-top)) 0 6px;text-transform:uppercase}
[lang=ar] .ttl{font-family:Alexandria;font-weight:900;font-size:34px}
.sub{color:var(--mut);margin:0 0 10px;font-size:14px}
.hint{color:var(--mut);font-size:13px;line-height:1.75;margin:8px 0 12px}
.btn{display:block;width:100%;background:var(--red);color:#fff;font-weight:900;font-size:18px;padding:17px;margin-top:16px;clip-path:var(--cut);letter-spacing:.02em;text-transform:uppercase;box-shadow:0 10px 30px #ff1f2d33}
.btn:active{transform:translateY(1px);background:var(--red2)}
.btn.sm{padding:11px;font-size:15px;margin-top:12px}
.btn.ghost{background:var(--p2);color:var(--ink);box-shadow:none;font-weight:700}
.btn.danger{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.chip{background:var(--p);border:1px solid var(--line);padding:9px 16px;font-weight:700;font-size:15px;white-space:nowrap;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.seg{display:flex;gap:6px}.seg .chip{flex:1;text-align:center;padding:12px 4px}
/* intro */
.intro{position:relative;min-height:72vh;display:flex;align-items:flex-end;overflow:hidden}
.intro-bg,.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.35) brightness(.55)}
.intro::after,.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07070855 0%,#0707088a 45%,var(--bg) 100%),linear-gradient(115deg,transparent 55%,#ff1f2d40 55.2%,transparent 70%);pointer-events:none}
.intro::before,.hero::before{content:"";position:absolute;inset:0;background:#ff1f2d;mix-blend-mode:multiply;opacity:.45;z-index:1;pointer-events:none}
.intro-in{position:relative;z-index:2;padding:calc(20px + env(safe-area-inset-top)) 20px 26px;width:100%;max-width:680px;margin:0 auto}
.intro .logo{margin:40px 0 18px}.intro .logo small{font-size:19px;letter-spacing:.5em;margin-bottom:4px}.intro .mark{width:136px;height:70px}
.intro h1{font-size:clamp(46px,14vw,78px)}
.intro p{color:#d9d9de;font-size:17px;margin:10px 0 0;max-width:30ch}
.langsw{display:flex;gap:6px;justify-content:flex-end}
.intro .langsw{position:absolute;top:calc(16px + env(safe-area-inset-top));inset-inline-end:16px}
.form .field{margin-top:22px}
.field>label{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-bottom:10px}
.field>label i{font-style:normal;font-family:Anton;color:var(--red);font-size:22px}
.opts.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{background:var(--p);border:1.5px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;clip-path:var(--cut)}
.opt b{font-size:16px;font-weight:900}.opt span{font-size:11.5px;color:var(--mut);line-height:1.4}
.opt.on{border-color:var(--red);background:linear-gradient(160deg,#3a0007,#16070a)}
.opt.on span{color:#ffb3b8}
.disc{color:var(--mut);font-size:12px;line-height:1.7;text-align:center;margin-top:20px}
/* hero */
.hero{position:relative;min-height:330px;overflow:hidden;display:flex;align-items:flex-end}
.hero-in{position:relative;z-index:2;width:100%;max-width:680px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 18px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px}
.wkc{font-size:13px;color:#ddd;background:#0009;padding:5px 12px;border:1px solid #ffffff22}
.wkc b{color:var(--red);font-family:Anton;font-size:16px;letter-spacing:.03em}
.dnum{display:flex;align-items:baseline;gap:10px;line-height:.9}
.dnum span{font-family:Anton;color:var(--red);font-size:18px;letter-spacing:.12em;text-transform:uppercase}
[lang=ar] .dnum span{font-family:Alexandria;font-weight:900;letter-spacing:0}
.dnum b{font-family:Anton;font-size:86px;color:transparent;-webkit-text-stroke:2px #fff;line-height:.85}
.hero h1{font-size:clamp(36px,11vw,58px);margin-top:4px}
.dm{margin:4px 0 0;color:#cfcfd6;font-weight:500}
.daypick{display:flex;gap:6px;margin-top:16px}
.daypick button{font-family:Anton;font-size:18px;width:46px;height:42px;background:#000a;border:1px solid #ffffff2a;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.daypick .on{background:var(--red);border-color:var(--red)}
.clock{font-family:Anton;font-size:40px;color:var(--red);margin-top:10px;letter-spacing:.04em}
.warm{border-inline-start:3px solid var(--red);background:var(--p);padding:12px 14px;font-size:14px;line-height:1.75;color:#d5d5dc;margin-bottom:14px}
/* exercise cards */
.list{display:grid;gap:10px}
.ex{background:var(--p);border:1px solid var(--line);position:relative}
.ex.open{border-color:#4a0b12;background:#0f0f12}
.ex.open::before{content:"";position:absolute;inset-block:0;inset-inline-start:-1px;width:3px;background:var(--red)}
.ex.complete .thumb img{filter:grayscale(1) brightness(.35)}
.ex header{display:flex;gap:12px;padding:10px;cursor:pointer;align-items:stretch}
.thumb{position:relative;flex:none;width:84px;height:104px;overflow:hidden;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.25) brightness(.85)}
.idx{position:absolute;inset-inline-start:0;bottom:0;background:var(--red);font-family:Anton;font-size:20px;padding:0 8px;line-height:1.5}
.complete .idx{font-family:Alexandria;font-weight:900}
.exh{flex:1;display:flex;flex-direction:column;justify-content:center}
.exh h3{margin:0;font-size:18px;font-weight:900;line-height:1.3}
.exh p{margin:0 0 8px;color:var(--mut);font-size:12px}
.rx{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rx b{font-family:Anton;font-size:19px;letter-spacing:.03em;color:#fff;background:var(--red);padding:0 8px;line-height:1.45}
.rx span{font-size:12px;color:#c8c8d0;border:1px solid var(--line);padding:1px 8px}
.rx .prog{color:#fff;border-color:var(--red)}
.body{padding:0 10px 14px}
.media{margin-bottom:12px}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs button{flex:1;padding:9px 6px;background:var(--p2);font-weight:800;font-size:14px;color:var(--mut)}
.tabs .on{background:#fff;color:#000}
.gymshot{position:relative;background:#000}
.gymshot img{width:100%;max-height:560px;object-fit:cover}
.ts{position:absolute;bottom:10px;inset-inline-start:10px;background:var(--red);font-size:12px;padding:2px 10px;font-weight:800}
.note-s{font-size:12px;color:var(--mut);margin:6px 0 0;line-height:1.6}
.sug{background:var(--p2);border-inline-start:3px solid var(--mut);padding:9px 12px;font-size:14px;margin-bottom:10px}
.sug.up{border-color:var(--red);background:#1d0709}
.sug b{font-weight:900}
.sets{background:#000;padding:8px;margin-bottom:12px;border:1px solid var(--line)}
.sh,.srow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 52px;gap:6px;align-items:center}
.sh{font-size:11px;color:var(--mut);text-align:center;padding:0 0 6px;text-transform:uppercase}
.srow{margin-bottom:6px}
.sn{font-family:Anton;font-size:20px;color:var(--mut);text-align:center}
.srow input{width:100%;height:50px;background:var(--p2);border:1px solid var(--line);color:#fff;text-align:center;font-size:22px;font-family:Anton;letter-spacing:.03em;border-radius:0}
.srow input::placeholder{color:#4c4c56}
.srow input:focus{border-color:var(--red);outline:0}
.ck{height:50px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center}
.ck svg{width:24px;height:24px;fill:none;stroke:#555;stroke-width:3;stroke-linecap:square}
.srow.done .ck{background:var(--red);border-color:var(--red)}.srow.done .ck svg{stroke:#fff}
.srow.done .sn{color:var(--red)}.srow.done input{color:#ff9aa1;border-color:#3a0c11}
.sact{display:flex;gap:8px;justify-content:center;margin-top:4px}
.mini{font-size:13px;color:var(--mut);border:1px solid var(--line);padding:5px 14px}
.how h4{margin:14px 0 4px;font-size:13px;color:var(--red);text-transform:uppercase;letter-spacing:.06em;font-weight:900}
.how ul,.how ol{margin:0;padding-inline-start:20px;line-height:1.85;font-size:15px;color:#dedee4}
.how ol li::marker{color:var(--red);font-family:Anton}
.how .tips li::marker{content:"▲  ";color:var(--red);font-size:10px}

/* player: start -> end on a rep tempo */
.player{position:relative;aspect-ratio:3/2;background:#000;overflow:hidden}
.player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 4.6s ease-in-out infinite}
.player img.b{animation:rep 4.6s ease-in-out infinite,kb 4.6s ease-in-out infinite}
@keyframes rep{0%,12%{opacity:0}30%,44%{opacity:1}80%,100%{opacity:0}}
@keyframes kb{0%,100%{transform:scale(1.02)}37%{transform:scale(1.09) translateY(-1.5%)}}
.player::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,#000c);pointer-events:none}
.cap{position:absolute;inset-inline:12px;bottom:16px;z-index:2;height:28px}
.cap span{position:absolute;inset-inline-start:0;bottom:0;font-weight:900;font-size:15px;background:var(--red);padding:2px 10px;opacity:0}
.cap .c1{animation:c1 4.6s infinite}.cap .c2{animation:c2 4.6s infinite;background:#fff;color:#000}
@keyframes c1{0%,10%{opacity:0}12%,44%{opacity:1}46%,100%{opacity:0}}
@keyframes c2{0%,44%{opacity:0}46%,80%{opacity:1}82%,100%{opacity:0}}
.pos{position:absolute;top:10px;inset-inline-start:10px;display:flex;z-index:2}
.pos b{font-size:12px;font-weight:900;padding:2px 9px;background:#000b}
.pos .s{animation:ps 4.6s infinite}.pos .e{animation:pe 4.6s infinite}
@keyframes ps{0%,20%,80%,100%{background:var(--red)}30%,70%{background:#000b}}
@keyframes pe{0%,20%,80%,100%{background:#000b}30%,70%{background:var(--red)}}
.bar{position:absolute;inset-inline:0;bottom:0;height:4px;background:#ffffff22;z-index:2}
.bar i{display:block;height:100%;background:var(--red);animation:bar 4.6s linear infinite}
@keyframes bar{from{width:0}to{width:100%}}
.yt{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;padding:11px;background:var(--p2);border:1px solid var(--line);color:#fff;text-decoration:none;font-weight:800;font-size:14px}
.yt svg{width:22px;height:22px;fill:#fff;background:var(--red);border-radius:5px}
/* official photos */
img.prod{background:#fff;object-fit:contain!important;filter:none!important;padding:4%}
.thumb img.prod,.lim img.prod,.pi img.prod,.pr img.prod,.swapi img.prod{padding:6%}
.thumb img,.lim img,.pi img,.pr img{filter:none!important}
.offshot{position:relative;background:#000;aspect-ratio:16/10;overflow:hidden}.offshot.white{background:#fff;aspect-ratio:1/1;max-height:420px;margin:0 auto}
.offshot img{width:100%;height:100%;object-fit:cover}
.mdl{position:absolute;inset-inline-start:0;bottom:0;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;direction:ltr}
.sublbl{font-size:12px;color:var(--mut);margin:10px 0 4px}
.gymshot.small img{max-height:240px}
/* video */
.vbox{position:relative;aspect-ratio:16/10;background:#000;overflow:hidden;cursor:pointer;display:block;width:100%}
.vbox img{width:100%;height:100%;object-fit:cover;filter:brightness(.55) contrast(1.1)}
.vbox .play{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;background:var(--red);display:grid;place-items:center;clip-path:var(--cut);box-shadow:0 0 0 6px #ff1f2d44}
.vbox .play svg{width:34px;height:34px;fill:#fff}
.vmeta{position:absolute;inset-inline:0;bottom:0;padding:12px;background:linear-gradient(transparent,#000e);text-align:start}
.vmeta b{display:block;font-size:15px;font-weight:900;line-height:1.35;direction:ltr;text-align:left}
.vmeta span{font-size:12px;color:#c9c9d0}.vmeta i{font-style:normal;color:#fff;background:var(--red);padding:0 6px;font-weight:800}
.vframe{position:relative;aspect-ratio:16/9;background:#000}.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{display:block;text-align:end;font-size:12.5px;color:var(--mut);padding:6px 2px 0;text-decoration:none}
/* muscle map */
.mmap{display:grid;grid-template-columns:1fr;gap:12px;background:#000;border:1px solid var(--line);padding:12px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:360px;margin:0 auto;width:100%}
.figs figure{margin:0;text-align:center}.figs figcaption{font-size:11px;color:var(--mut)}
.bfig{width:100%;height:auto;max-height:300px}
.bfig .sil *{fill:#1b1b21}
.bfig .m0{fill:#2a2a31}.bfig .m1{fill:var(--red);filter:drop-shadow(0 0 4px #ff1f2d99)}.bfig .m2{fill:#7a1119}
.mlist h4{margin:0 0 8px;font-size:13px;color:var(--red);font-weight:900;text-transform:uppercase}
.mlist div{display:flex;flex-wrap:wrap;gap:5px}
.mlist span{font-size:12.5px;font-weight:800;padding:2px 8px}
.mlist .p1{background:var(--red)}.mlist .p2{background:#4a0a10;color:#ffc2c7}
.leg{font-size:11px;color:var(--mut);margin:10px 0 0;display:flex;align-items:center;gap:5px}
.leg i{display:inline-block;width:10px;height:10px}.leg i.p1{background:var(--red)}.leg i.p2{background:#7a1119;margin-inline-start:6px}
/* profiles */
.pbar{display:flex;gap:6px;margin:-30px 0 18px;flex-wrap:wrap}
.pbar button,.plist button{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;background:#000a;border:1px solid #ffffff2a;font-weight:800;font-size:14px}
[dir=rtl] .pbar button,[dir=rtl] .plist button{padding:5px 5px 5px 12px}
.pbar span,.plist span{width:26px;height:26px;display:grid;place-items:center;background:#333;font-family:Alexandria;font-weight:900}
.pbar .on,.plist .on{border-color:var(--red)}.pbar .on span,.plist .on span{background:var(--red)}
.page>.pbar{margin:calc(10px + env(safe-area-inset-top)) 0 0}
.plist{display:flex;flex-wrap:wrap;gap:6px}.plist button{background:var(--p)}
.padd{border:1px dashed var(--mut)!important;color:var(--mut);padding:8px 14px!important}
.tin{width:100%;height:52px;background:var(--p);border:1px solid var(--line);color:#fff;font-size:18px;font-weight:700;padding:0 14px;border-radius:0}
.tin:focus{border-color:var(--red);outline:0}
/* body weight */
.bw{background:var(--p);border:1px solid var(--line);padding:12px}
.bwnow{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.bwnow b{font-family:Anton;font-size:42px;line-height:1}.bwnow b small{font-size:16px;color:var(--mut);margin-inline-start:3px}
.bwnow span{color:var(--mut);font-size:13px}.bwnow em{font-style:normal;background:var(--red);font-weight:900;font-size:13px;padding:2px 10px}
.bwline{width:100%;height:60px;margin:8px 0}.bwline polyline{fill:none;stroke:var(--red);stroke-width:2;vector-effect:non-scaling-stroke}
.bwin{display:flex;gap:8px;align-items:stretch}.bwin .btn{width:auto;margin:0;padding:0 22px}
@media (prefers-reduced-motion:reduce){.player img,.player img.b,.cap span,.bar i,.pos b{animation:none}.player img.b{opacity:0}.cap .c1{opacity:1}}
/* rest */
#rest{display:none}
#rest.show{display:flex;position:fixed;inset-inline:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;background:#120305;border:1px solid var(--red);padding:10px 12px;align-items:center;gap:12px;box-shadow:0 12px 40px #000c,0 0 0 4px #ff1f2d1a;max-width:656px;margin:0 auto}
.ring{width:48px;height:48px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#2a0a0e;stroke-width:5}.ring .fg{stroke:var(--red);stroke-dasharray:119.4;transition:stroke-dashoffset .5s linear}
.rl{flex:1;display:flex;flex-direction:column;line-height:1.1}.rl span{font-size:12px;color:var(--mut)}.rl b{font-family:Anton;font-size:30px;letter-spacing:.03em}
#rest button{background:var(--p2);padding:10px 14px;font-weight:800}
/* nav */
.nav{position:fixed;bottom:0;inset-inline:0;display:flex;justify-content:space-around;background:#070708f2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#6f6f7a;font-size:11px;font-weight:700;padding:8px 6px 2px;min-width:60px}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
.nav .on{color:#fff}.nav .on::before{content:"";position:absolute;top:-5px;inset-inline:18px;height:3px;background:var(--red)}
.nav .on svg{stroke:var(--red)}
/* plan */
.pday{background:var(--p);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.pday.next{border-color:var(--red);box-shadow:inset 0 0 0 1px #ff1f2d44}
.pdh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pn{font-family:Anton;font-size:44px;color:transparent;-webkit-text-stroke:1.5px var(--red);line-height:1}
.pdh h3{margin:0;font-size:20px;font-weight:900}.pdh p{margin:0;color:var(--mut);font-size:13px}
.pdh>div{flex:1}
.tag{background:var(--red);font-weight:900;font-size:12px;padding:3px 10px}
.prow{display:grid;gap:6px}
.pi{display:flex;gap:10px;align-items:center;background:#0b0b0d;padding:4px}
.pi img{width:44px;height:54px;object-fit:cover;filter:grayscale(1) contrast(1.2)}
.pi b{display:block;font-size:14px;font-weight:800;line-height:1.35}.pi span{font-family:Anton;color:var(--red);font-size:14px;letter-spacing:.03em}
.note{border-inline-start:3px solid var(--red);background:var(--p);padding:12px 14px;font-size:14px;line-height:1.75;color:#d0d0d6}
/* library */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lcard{background:var(--p);border:1px solid var(--line);text-align:start;display:flex;flex-direction:column;padding-bottom:10px}
.lim{position:relative;aspect-ratio:4/5;overflow:hidden;background:#000;margin-bottom:8px}
.lim img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.25) brightness(.8);transition:opacity .3s}
.lim .lp{position:absolute;inset:auto 0 0 auto;inset-inline-end:6px;bottom:6px;width:46%;height:auto;aspect-ratio:3/2;border:2px solid var(--red);filter:none}
.lcard b{font-size:14px;font-weight:900;padding:0 10px;line-height:1.35}.lcard span{font-size:12px;color:var(--mut);padding:0 10px}
.back{color:var(--red);font-weight:900;padding:calc(10px + env(safe-area-inset-top)) 0 0}
.alt{margin:20px 0 8px;font-weight:900}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.stats div{background:var(--p);border:1px solid var(--line);padding:14px 8px;text-align:center}
.stats b{display:block;font-family:Anton;font-size:38px;line-height:1;color:#fff}.stats small{font-size:18px;color:var(--mut)}
.stats span{font-size:12px;color:var(--mut)}
.stats div:first-child b{color:var(--red)}
.sec{font-size:18px;font-weight:900;margin:24px 0 10px}
.prs{display:grid;gap:6px}
.pr{display:grid;grid-template-columns:40px minmax(0,1fr) 80px auto;gap:10px;align-items:center;background:var(--p);border:1px solid var(--line);padding:6px 10px 6px 6px;font-size:14px;font-weight:700}
.pr img{width:40px;height:48px;object-fit:cover;filter:grayscale(1)}
.pr b{font-family:Anton;font-size:22px;color:var(--red)}.pr small{font-size:12px;color:var(--mut);margin-inline-start:2px}
.spark{width:80px;height:26px}.spark polyline{fill:none;stroke:var(--red);stroke-width:2.5}
.logi{display:flex;justify-content:space-between;align-items:center;background:var(--p);border:1px solid var(--line);padding:10px 12px;margin-bottom:6px}
.logi b{display:block;font-weight:900}.logi span{font-size:12.5px;color:var(--mut)}.logi em{font-style:normal;font-family:Anton;color:#ddd;font-size:16px;white-space:nowrap}
.empty{color:var(--mut)}
/* sheets */
.sheet{position:fixed;inset:0;background:#000c;z-index:40;display:flex;align-items:flex-end}
.sheet-in{background:var(--p);border-top:3px solid var(--red);width:100%;max-width:680px;margin:0 auto;max-height:86vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-in h3{margin:0 0 12px;font-weight:900;font-size:19px}
.swapi{display:flex;gap:8px;align-items:center;width:100%;background:var(--p2);border:1.5px solid var(--line);padding:6px;margin-bottom:8px;text-align:start}
.swapi.on{border-color:var(--red)}
.swapi img{width:52px;height:64px;object-fit:cover}.swapi img+img{width:80px;height:64px}
.swapi img:first-child{filter:grayscale(1)}
.swapi b{display:block;font-weight:900;line-height:1.35}.swapi span{font-size:12px;color:var(--mut)}
.dlg{align-items:center;padding:20px}.dlg .sheet-in{border:1px solid var(--red)}
.dmsg{font-size:18px;font-weight:700;line-height:1.7;margin:4px 0 4px}
.dbtns{display:flex;gap:8px}.dbtns .btn{flex:1}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));inset-inline:14px;background:var(--red);color:#fff;font-weight:900;text-align:center;padding:14px;z-index:50;clip-path:var(--cut);animation:tin .35s}
@keyframes tin{from{transform:translateY(-24px);opacity:0}}

@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{min-height:380px}}
</style>
