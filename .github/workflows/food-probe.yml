name: food-probe
on:
  push:
    branches: [food-probe]
    paths: [food-tool/probe.py, .github/workflows/food-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 food-tool/probe.py
      - run: |
          git config user.name "food-bot"; git config user.email "food-bot@users.noreply.github.com"
          git add food-tool/out && git commit -m "probe output" && git push
