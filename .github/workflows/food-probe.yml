name: food-probe
on:
  push:
    branches: [food-test]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash food-tool/probe2.sh || true
      - run: |
          git config user.name "food-bot"; git config user.email "food-bot@users.noreply.github.com"
          git add -f food-tool/out && git commit -m "probe output" && git push
