name: food-deals
# Refreshes the saved Talabat deals for the home area (instant fallback when the live server is slow or down).
on:
  schedule:
    - cron: "17 5,9,12,15,18 * * *"   # ~9am, 1pm, 4pm, 7pm, 10pm UAE time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: food-deals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect deals
        run: |
          python3 food-tool/fetch_areas.py || echo "area list not refreshed"
          python3 food-tool/scrape.py
      - name: Save if changed
        run: |
          git config user.name "food-bot"
          git config user.email "food-bot@users.noreply.github.com"
          git add food/*.json
          git diff --cached --quiet || (git commit -m "Update food deals" && git pull --rebase -q && git push)
